<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Buyer Network - VaultForge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #0a0a0a; 
      color: #fff; 
      font-family: 'Arial', sans-serif; 
      padding: 20px;
    }
   .container { max-width: 600px; margin: 0 auto; }
    
    /* CLOSE/BACK BUTTON */
   .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
   .back-btn {
      background: none;
      border: 1px solid #333;
      color: #FFD700;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
    }
    
    /* 1% BANNER */
   .fee-banner {
      background: #1a1a1a;
      border: 2px solid #10b981;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 25px;
      text-align: center;
    }
   .fee-banner strong { color: #10b981; }
    
   .form-group { margin-bottom: 20px; }
   label { 
      display: block; 
      color: #FFD700; 
      margin-bottom: 8px; 
      font-size: 14px;
    }
   input, select { 
      width: 100%; 
      background: #1a1a1a; 
      border: 1px solid #333; 
      color: #fff; 
      padding: 12px; 
      border-radius: 6px; 
      font-size: 16px;
    }
   .checkbox-group {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 15px;
    }
   .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #FFD700;
      cursor: pointer;
      margin: 8px 0;
    }
   .checkbox-group input[type="checkbox"] {
      width: 20px;
      height: 20px;
    }
    
    /* BUYER CONTRACT CHECKBOX */
   .contract-box {
      background: #1a1a1a;
      border: 2px solid #FFD700;
      border-radius: 8px;
      padding: 15px;
      margin: 25px 0;
    }
   .contract-box label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }
   .contract-box input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      flex-shrink: 0;
    }
   .contract-box a { color: #10b981; text-decoration: underline; }
    
   .submit-btn {
      width: 100%;
      background: #FFD700;
      color: #000;
      border: none;
      padding: 18px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
    }
   .submit-btn:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
    }
    
    /* SUCCESS MESSAGE */
   .success-msg {
      display: none;
      background: #1a1a1a;
      border: 2px solid #10b981;
      border-radius: 8px;
      padding: 30px;
      text-align: center;
    }
   .success-msg h2 { color: #10b981; margin-bottom: 15px; }
   .success-msg button {
      background: #FFD700;
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: bold;
      margin: 10px 5px 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- CLOSE/BACK BUTTON -->
    <div class="top-bar">
      <a href="/" class="back-btn">← Back to Home</a>
      <button onclick="window.close()" class="back-btn">Close</button>
    </div>
    
    <!-- 1% FEE BANNER -->
    <div class="fee-banner">
      <strong>1% Coordination Fee at Closing</strong><br>
      No monthly fees. No cost until you buy a deal.
    </div>
    
    <!-- FORM -->
    <form id="buyerForm">
      <div class="form-group">
        <label>Land Buy Box</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="buybox" value="retail"> Retail</label>
          <label><input type="checkbox" name="buybox" value="office"> Office</label>
          <label><input type="checkbox" name="buybox" value="industrial"> Industrial</label>
        </div>
      </div>
      
      <div class="form-group">
        <label>Land Buy Box</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="landbox" value="residential-lots"> Residential Lots</label>
          <label><input type="checkbox" name="landbox" value="development"> Development</label>
          <label><input type="checkbox" name="landbox" value="agricultural"> Agricultural</label>
        </div>
      </div>
      
      <div class="form-group">
        <label>Min Acreage</label>
        <select name="minAcreage">
          <option>Any Size</option>
          <option>1+ Acres</option>
          <option>5+ Acres</option>
          <option>10+ Acres</option>
        </select>
      </div>
      
      <!-- BUYER CONTRACT CHECKBOX - LEGALLY BINDING -->
      <div class="contract-box">
        <label>
          <input type="checkbox" id="agreeBuyerContract" required>
          <span>I agree to the <a href="/buyer-agreement.html" target="_blank">Veteran Pride VaultForge LLC Buyer Agreement</a>. I authorize a 1% coordination fee to be paid to VaultForge at closing on any deal I purchase.</span>
        </label>
      </div>
      
      <button type="submit" class="submit-btn" id="buyerSubmitBtn" disabled>JOIN BUYER NETWORK</button>
    </form>
    
    <!-- SUCCESS MESSAGE - SHOWS AFTER SUBMIT -->
    <div class="success-msg" id="buyerSuccessMsg">
      <h2>You're In!</h2>
      <p>Check your email for deal alerts.</p>
      <p>First deals hitting your inbox within 24 hours.</p>
      <button onclick="window.location.href='/'">Back to Home</button>
    </div>
    
  </div>

  <script>
    // Enable submit only when checkbox checked
    const buyerCheckbox = document.getElementById('agreeBuyerContract');
    const buyerSubmitBtn = document.getElementById('buyerSubmitBtn');
    buyerCheckbox.addEventListener('change', () => {
      buyerSubmitBtn.disabled = !buyerCheckbox.checked;
    });
    
    // Handle form submit
    document.getElementById('buyerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Submit to your API here
      // await fetch('/api/submit-buyer', { method: 'POST', body: new FormData(e.target) });
      
      // Hide form, show success
      document.getElementById('buyerForm').style.display = 'none';
      document.getElementById('buyerSuccessMsg').style.display = 'block';
    });
  </script>
</body>
</html>
