<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buyer Access - VaultForge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: Arial, sans-serif; padding: 20px; padding-bottom: 120px; }
 .container { max-width: 500px; margin: 0 auto; }
 .back-btn { color: #10b981; text-decoration: none; font-size: 16px; margin-bottom: 20px; display: inline-block; }
    h1 { color: #FFD700; margin-bottom: 20px; text-align: center; }
 .form-group { margin-bottom: 15px; }
    label { display: block; color: #ccc; margin-bottom: 5px; font-size: 14px; }
    input, select { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 4px; font-size: 16px; }
 .btn { width: 100%; background: #10b981; color: #000; border: none; padding: 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 18px; margin-top: 10px; text-decoration: none; display: block; text-align: center; }
 .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
 .checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
 .checkbox-label { display: flex; align-items: center; color: #ccc; font-size: 14px; }
 .checkbox-label input { width: auto; margin-right: 8px; }
 .checkbox-row { display: flex; align-items: flex-start; gap: 10px; margin: 20px 0; }
 .checkbox-row input { width: 20px; height: 20px; margin-top: 2px; flex-shrink: 0; }
 .checkbox-row label { color: #10b981; font-size: 14px; line-height: 1.4; }
 .success { display: none; text-align: center; padding: 40px 20px; }
 .success h2 { color: #10b981; margin-bottom: 15px; font-size: 24px; }
 .success p { color: #ccc; margin-bottom: 25px; line-height: 1.6; }
 .section-title { color: #FFD700; font-size: 16px; margin: 25px 0 10px 0; border-bottom: 1px solid #333; padding-bottom: 5px; }
  select[multiple] { height: auto; min-height: 120px; }
  </style>
</head>
<body>
  <div class="container">
    <a href="./index.html" class="back-btn">← Back</a>
    <div id="formWrap">
      <h1>Cash Buyer Access</h1>
      <form id="buyerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="full_name" required>
        </div>
        <div class="grid">
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" name="phone" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
          </div>
        </div>
        <div class="form-group">
          <label>What state are you in?</label>
          <select name="buyer_state" required>
            <option value="">Select State</option>
            <option value="AL">Alabama</option><option value="AK">Alaska</option><option value="AZ">Arizona</option><option value="AR">Arkansas</option>
            <option value="CA">California</option><option value="CO">Colorado</option><option value="CT">Connecticut</option><option value="DE">Delaware</option>
            <option value="FL">Florida</option><option value="GA">Georgia</option><option value="HI">Hawaii</option><option value="ID">Idaho</option>
            <option value="IL">Illinois</option><option value="IN">Indiana</option><option value="IA">Iowa</option><option value="KS">Kansas</option>
            <option value="KY">Kentucky</option><option value="LA">Louisiana</option><option value="ME">Maine</option><option value="MD">Maryland</option>
            <option value="MA">Massachusetts</option><option value="MI">Michigan</option><option value="MN">Minnesota</option><option value="MS">Mississippi</option>
            <option value="MO">Missouri</option><option value="MT">Montana</option><option value="NE">Nebraska</option><option value="NV">Nevada</option>
            <option value="NH">New Hampshire</option><option value="NJ">New Jersey</option><option value="NM">New Mexico</option><option value="NY">New York</option>
            <option value="NC">North Carolina</option><option value="ND">North Dakota</option><option value="OH">Ohio</option><option value="OK">Oklahoma</option>
            <option value="OR">Oregon</option><option value="PA">Pennsylvania</option><option value="RI">Rhode Island</option><option value="SC">South Carolina</option>
            <option value="SD">South Dakota</option><option value="TN">Tennessee</option><option value="TX">Texas</option><option value="UT">Utah</option>
            <option value="VT">Vermont</option><option value="VA">Virginia</option><option value="WA">Washington</option><option value="WV">West Virginia</option>
            <option value="WI">Wisconsin</option><option value="WY">Wyoming</option>
          </select>
        </div>
        
        <div class="section-title">Buy Box</div>
        <div class="form-group">
          <label>Deal Types</label>
          <div class="checkbox-group">
            <label class="checkbox-label"><input type="checkbox" name="deal_types" value="Residential"> Residential</label>
            <label class="checkbox-label"><input type="checkbox" name="deal_types" value="Commercial"> Commercial</label>
            <label class="checkbox-label"><input type="checkbox" name="deal_types" value="Land"> Land</label>
          </div>
        </div>
        <div class="grid">
          <div class="form-group">
            <label>Budget Min</label>
            <input type="number" name="budget_min" placeholder="200000">
          </div>
          <div class="form-group">
            <label>Budget Max</label>
            <input type="number" name="budget_max" placeholder="500000">
          </div>
        </div>
        <div class="grid">
          <div class="form-group">
            <label>Min ARV</label>
            <input type="number" name="min_arv">
          </div>
          <div class="form-group">
            <label>Max Rehab</label>
            <input type="number" name="max_rehab">
          </div>
        </div>
        <div class="form-group">
          <label>Close Timeframe</label>
          <select name="close_timeframe">
            <option value="">Select</option>
            <option value="ASAP">ASAP</option>
            <option value="15 Days">15 Days</option>
            <option value="30 Days">30 Days</option>
            <option value="45 Days">45 Days</option>
            <option value="60+ Days">60+ Days</option>
          </select>
        </div>
        <div class="form-group">
          <label>Markets You Operate In - Select Multiple</label>
          <select name="markets" multiple required>
            <option value="GA">Georgia</option>
            <option value="FL">Florida</option>
            <option value="TX">Texas</option>
            <option value="NC">North Carolina</option>
            <option value="SC">South Carolina</option>
            <option value="AL">Alabama</option>
            <option value="TN">Tennessee</option>
          </select>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="agree1pct" required>
          <label for="agree1pct">I agree to 1% coordination fee paid to Veteran Pride VaultForge LLC at closing. I understand I only pay if I close on a deal.</label>
        </div>
        <button type="submit" class="btn">GET DEAL ACCESS</button>
      </form>
    </div>
    <div id="success" class="success">
      <h2>Profile Submitted</h2>
      <p>Your buyer profile is under review. On approval we will contact you with a 1% coordination fee contract and matching deals.</p>
      <a href="./buyers.html" class="btn">Submit Another Application</a>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseUrl = 'https://cnxrwnxtpfxoyjymuwvs.supabase.co';
const supabaseKey = 'sb_publishable_t-QviJYrFalcqFST7igSQw_9JbkCeXX';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

document.getElementById('buyerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(e.target);
  
  const buyerData = {
    full_name: formData.get('full_name'),
    phone: formData.get('phone'),
    email: formData.get('email'),
    buyer_state: formData.get('buyer_state'),
    budget_min: formData.get('budget_min')? parseInt(formData.get('budget_min')) : null,
    budget_max: formData.get('budget_max')? parseInt(formData.get('budget_max')) : null,
    markets: Array.from(e.target.querySelector('[name="markets"]').selectedOptions).map(o => o.value),
    deal_types: formData.getAll('deal_types'),
    min_arv: formData.get('min_arv')? parseInt(formData.get('min_arv')) : null,
    max_rehab: formData.get('max_rehab')? parseInt(formData.get('max_rehab')) : null,
    close_timeframe: formData.get('close_timeframe')
  };

  const { error } = await supabase.from('buyers').insert([buyerData]);
  
  if (error) {
    alert('Error: ' + error.message);
    return;
  }
  
  document.getElementById('formWrap').style.display = 'none';
  document.getElementById('success').style.display = 'block';
});
</script>
</body>
</html>
