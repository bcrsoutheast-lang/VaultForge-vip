<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Buyer Network - VaultForge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: 'Arial', sans-serif; padding: 20px; }
   .container { max-width: 600px; margin: 0 auto; }
    
   .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
   .back-btn { background: none; border: 1px solid #333; color: #FFD700; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; text-decoration: none; }
    
   .fee-banner { background: #1a1a1a; border: 2px solid #10b981; border-radius: 8px; padding: 15px; margin-bottom: 25px; text-align: center; }
   .fee-banner strong { color: #10b981; }
    
   .form-group { margin-bottom: 20px; }
   label { display: block; color: #FFD700; margin-bottom: 8px; font-size: 14px; }
   input, select, textarea { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 6px; font-size: 16px; }
   .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    
   .checkbox-group { background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 15px; margin-bottom: 15px; }
   .checkbox-group h3 { color: #FFD700; font-size: 16px; margin-bottom: 12px; }
   .checkbox-group label { display: flex; align-items: center; gap: 10px; color: #FFD700; cursor: pointer; margin: 10px 0; font-weight: normal; }
   .checkbox-group input[type="checkbox"] { width: 20px; height: 20px; }
    
   .contract-box { background: #1a1a1a; border: 2px solid #FFD700; border-radius: 8px; padding: 15px; margin: 25px 0; }
   .contract-box label { display: flex; align-items: flex-start; gap: 10px; color: #fff; cursor: pointer; font-size: 14px; }
   .contract-box input[type="checkbox"] { width: 20px; height: 20px; margin-top: 2px; flex-shrink: 0; }
   .contract-box a { color: #10b981; text-decoration: underline; }
    
   .submit-btn { width: 100%; background: #FFD700; color: #000; border: none; padding: 18px; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; }
   .submit-btn:disabled { background: #333; color: #666; cursor: not-allowed; }
    
   .success-msg { display: none; background: #1a1a1a; border: 2px solid #10b981; border-radius: 8px; padding: 30px; text-align: center; }
   .success-msg h2 { color: #10b981; margin-bottom: 15px; }
   .success-msg button { background: #FFD700; color: #000; border: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; margin: 10px 5px 0; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <a href="/" class="back-btn">← Back to Home</a>
      <button onclick="window.close()" class="back-btn">Close</button>
    </div>
    
    <div class="fee-banner">
      <strong>1% Coordination Fee at Closing</strong><br>
      No monthly fees. No cost until you buy a deal.
    </div>
    
    <form id="buyerForm">
      <!-- BUYER INFO -->
      <div class="grid-2">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" name="name" required>
        </div>
        <div class="form-group">
          <label>Phone *</label>
          <input type="tel" name="phone" required>
        </div>
      </div>
      
      <div class="form-group">
        <label>Email *</label>
        <input type="email" name="email" required>
      </div>
      
      <div class="form-group">
        <label>Company/LLC Name</label>
        <input type="text" name="company">
      </div>
      
      <div class="grid-2">
        <div class="form-group">
          <label>Min Budget *</label>
          <input type="number" name="minBudget" placeholder="50000" required>
        </div>
        <div class="form-group">
          <label>Max Budget *</label>
          <input type="number" name="maxBudget" placeholder="500000" required>
        </div>
      </div>
      
      <div class="form-group">
        <label>Preferred Markets *</label>
        <input type="text" name="markets" placeholder="Atlanta, GA; Charlotte, NC" required>
      </div>
      
      <!-- RESIDENTIAL BUY BOX -->
      <div class="checkbox-group">
        <h3>Residential Buy Box</h3>
        <label><input type="checkbox" name="residential" value="single-family"> Single Family</label>
        <label><input type="checkbox" name="residential" value="condo"> Condo/Townhome</label>
        <label><input type="checkbox" name="residential" value="2-4-unit"> 2-4 Units</label>
        <label><input type="checkbox" name="residential" value="fix-flip"> Fix & Flip</label>
        <label><input type="checkbox" name="residential" value="buy-hold"> Buy & Hold</label>
      </div>
      
      <!-- COMMERCIAL BUY BOX -->
      <div class="checkbox-group">
        <h3>Commercial Buy Box</h3>
        <label><input type="checkbox" name="commercial" value="retail"> Retail</label>
        <label><input type="checkbox" name="commercial" value="office"> Office</label>
        <label><input type="checkbox" name="commercial" value="industrial"> Industrial</label>
        <label><input type="checkbox" name="commercial" value="multi-family"> Multi-Family 5+</label>
        <label><input type="checkbox" name="commercial" value="mixed-use"> Mixed Use</label>
      </div>
      
      <!-- LAND BUY BOX -->
      <div class="checkbox-group">
        <h3>Land Buy Box</h3>
        <label><input type="checkbox" name="land" value="residential-lots"> Residential Lots</label>
        <label><input type="checkbox" name="land" value="development"> Development</label>
        <label><input type="checkbox" name="land" value="agricultural"> Agricultural</label>
        <label><input type="checkbox" name="land" value="commercial-land"> Commercial Land</label>
      </div>
      
      <div class="form-group">
        <label>Min Acreage (Land Only)</label>
        <select name="minAcreage">
          <option value="">Any Size</option>
          <option value="1">1+ Acres</option>
          <option value="5">5+ Acres</option>
          <option value="10">10+ Acres</option>
          <option value="25">25+ Acres</option>
        </select>
      </div>
      
      <!-- 1% BUYER CONTRACT CHECKBOX -->
      <div class="contract-box">
        <label>
          <input type="checkbox" id="agreeBuyerContract" required>
          <span>I agree to the <a href="/buyer-agreement.html" target="_blank">Veteran Pride VaultForge LLC Buyer Agreement</a>. I authorize a 1% coordination fee to be paid to VaultForge at closing on any deal I purchase.</span>
        </label>
      </div>
      
      <button type="submit" class="submit-btn" id="buyerSubmitBtn" disabled>JOIN BUYER NETWORK</button>
    </form>
    
    <div class="success-msg" id="buyerSuccessMsg">
      <h2>You're In!</h2>
      <p>Check your email for deal alerts.</p>
      <p>First deals hitting your inbox within 24 hours.</p>
      <button onclick="window.location.href='/'">Back to Home</button>
    </div>
  </div>

  <script>
    const buyerCheckbox = document.getElementById('agreeBuyerContract');
    const buyerSubmitBtn = document.getElementById('buyerSubmitBtn');
    buyerCheckbox.addEventListener('change', () => {
      buyerSubmitBtn.disabled = !buyerCheckbox.checked;
    });
    
    document.getElementById('buyerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      // await fetch('/api/submit-buyer', { method: 'POST', body: new FormData(e.target) });
      document.getElementById('buyerForm').style.display = 'none';
      document.getElementById('buyerSuccessMsg').style.display = 'block';
    });
  </script>
</body>
</html>
