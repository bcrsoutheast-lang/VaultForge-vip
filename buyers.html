<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultForge VIP - Buyer Network</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a; 
            color: #fff; 
            line-height: 1.6;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #d4af37; font-size: 28px; margin-bottom: 8px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #d4af37; font-weight: 600; }
        input, select { 
            width: 100%; 
            padding: 12px; 
            background: #1a1a1a; 
            border: 1px solid #333; 
            border-radius: 6px; 
            color: #fff; 
            font-size: 16px;
        }
        .checkbox-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            margin-top: 8px;
        }
        .checkbox-item { 
            background: #1a1a1a; 
            border: 1px solid #333; 
            border-radius: 6px; 
            padding: 12px; 
            display: flex; 
            align-items: center; 
            gap: 8px;
            cursor: pointer;
        }
        .checkbox-item input { width: 20px; height: 20px; margin: 0; }
        .checkbox-item.checked { border-color: #d4af37; }
        button { 
            width: 100%; 
            padding: 16px; 
            background: linear-gradient(135deg, #d4af37, #b8941f); 
            color: #000; 
            border: none; 
            border-radius: 6px; 
            font-size: 18px; 
            font-weight: 700; 
            cursor: pointer;
            text-transform: uppercase;
        }
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); 
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.show { display: flex; }
        .modal-content { 
            background: #0a0a0a; 
            border: 2px solid #d4af37; 
            border-radius: 8px; 
            padding: 30px; 
            max-width: 500px; 
            text-align: center;
        }
        .modal-content h2 { color: #d4af37; margin-bottom: 16px; font-size: 24px; }
        .modal-content p { margin-bottom: 12px; }
        .gold { color: #d4af37; font-weight: 600; }
        .modal-close { 
            margin-top: 20px;
            padding: 12px 30px;
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
        }
        @media (max-width: 600px) { .checkbox-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>VAULTFORGE VIP</h1>
            <p>Join our private buyer network</p>
        </div>

        <form id="buyerForm">
            <div class="form-group">
                <label>Your Name *</label>
                <input type="text" name="buyer_name" required>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Phone *</label>
                <input type="tel" name="phone" required>
            </div>

            <div class="form-group">
                <label>Target States - Tap All That Apply *</label>
                <div class="checkbox-grid" id="states">
                    <label class="checkbox-item"><input type="checkbox" name="states" value="GA"> GEORGIA</label>
                    <label class="checkbox-item"><input type="checkbox" name="states" value="TN"> TENNESSEE</label>
                    <label class="checkbox-item"><input type="checkbox" name="states" value="AL"> ALABAMA</label>
                    <label class="checkbox-item"><input type="checkbox" name="states" value="FL"> FLORIDA</label>
                    <label class="checkbox-item"><input type="checkbox" name="states" value="SC"> S CAROLINA</label>
                </div>
            </div>

            <div class="form-group">
                <label>Residential Buy Box</label>
                <div class="checkbox-grid">
                    <label class="checkbox-item"><input type="checkbox" name="buybox_res" value="SFR Fix & Flip"> SFR Fix & Flip</label>
                    <label class="checkbox-item"><input type="checkbox" name="buybox_res" value="Buy & Hold"> Buy & Hold</label>
                    <label class="checkbox-item"><input type="checkbox" name="buybox_res" value="BRRRR"> BRRRR</label>
                    <label class="checkbox-item"><input type="checkbox" name="buybox_res" value="Vacant Land"> Vacant Land</label>
                </div>
            </div>

            <div class="form-group" id="landFields" style="display:none;">
                <label>Min Land Acreage</label>
                <select name="min_acres">
                    <option value="">Any Size</option>
                    <option value="0.25">0.25+ Acres</option>
                    <option value="1">1+ Acres</option>
                    <option value="5">5+ Acres</option>
                    <option value="10">10+ Acres</option>
                </select>
            </div>

            <div class="form-group">
                <label>Commercial Buy Box</label>
                <div class="checkbox-grid">
                    <label class="checkbox-item"><input type="checkbox" name="buybox_com" value="Multi-Family 5+"> Multi-Family 5+</label>
                    <label class="checkbox-item"><input type="checkbox" name="buybox_com" value="Retail"> Retail</label>
                    <label class="checkbox-item"><input type="checkbox" name="buybox_com" value="Office"> Office</label>
                    <label class="checkbox-item"><input type="checkbox" name="buybox_com" value="Industrial"> Industrial</label>
                </div>
            </div>

            <div class="form-group">
                <label>Max Purchase Price - Residential</label>
                <select name="max_price_res">
                    <option value="">Select Max...</option>
                    <option value="100000">$100K</option>
                    <option value="250000">$250K</option>
                    <option value="500000">$500K</option>
                    <option value="1000000">$1M+</option>
                </select>
            </div>

            <div class="form-group">
                <label>Max Purchase Price - Commercial</label>
                <select name="max_price_com">
                    <option value="">Select Max...</option>
                    <option value="500000">$500K</option>
                    <option value="1000000">$1M</option>
                    <option value="5000000">$5M</option>
                    <option value="10000000">$10M+</option>
                </select>
            </div>

            <button type="submit">JOIN BUYER NETWORK</button>
        </form>
    </div>

    <div class="modal" id="successModal">
        <div class="modal-content">
            <h2>PROFILE SAVED</h2>
            <p class="gold">Profile submitted for review.</p>
            <p>You'll only get deals for:</p>
            <p class="gold" id="selectedStates"></p>
            <p>When approved, you'll get an email from us.</p>
            <p>No dashboard. No login. Just off-market deals.</p>
            <button class="modal-close" onclick="closeModal()">CLOSE</button>
        </div>
    </div>

    <script>
        document.querySelectorAll('.checkbox-item input').forEach(cb => {
            cb.addEventListener('change', function() {
                this.parentElement.classList.toggle('checked', this.checked);
                if (this.value === 'Vacant Land') {
                    document.getElementById('landFields').style.display = this.checked ? 'block' : 'none';
                }
            });
        });

        document.getElementById('buyerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());
            data.states = formData.getAll('states');
            data.buybox_res = formData.getAll('buybox_res');
            data.buybox_com = formData.getAll('buybox_com');
            data.form_type = 'buyer';
            
            const res = await fetch('/api/save-deal', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            if (res.ok) {
                document.getElementById('selectedStates').textContent = data.states.join(', ');
                document.getElementById('successModal').classList.add('show');
            }
        });

        function closeModal() {
            document.getElementById('successModal').classList.remove('show');
            document.getElementById('buyerForm').reset();
            document.querySelectorAll('.checked').forEach(el => el.classList.remove('checked'));
        }
    </script>
</body>
</html>
