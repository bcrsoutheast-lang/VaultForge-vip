<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Buyer Network - VaultForge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 20px auto;
      background: #0a0a;
      border: 2px solid #D4AF37;
      border-radius: 8px;
      padding: 30px;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #111;
      border: 1px solid #333;
      color: #888;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .close-btn:hover { background: #222; color: #D4AF37; }
    .logo { display: block; margin: 0 auto 20px auto; max-width: 150px; }
    h1 { color: #D4AF37; text-align: center; margin-bottom: 8px; font-size: 26px; letter-spacing: 1px; }
    .tagline { text-align: center; color: #aaa; margin-bottom: 30px; font-size: 14px; }
    label { color: #D4AF37; font-size: 14px; font-weight: 600; display: block; margin: 16px 0 6px 0; }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      color: #fff;
      font-size: 16px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #D4AF37;
    }
    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 10px 0 20px 0;
    }
    .checkbox-item { 
      display: flex; 
      align-items: center; 
      background: #111;
      border: 2px solid #333;
      border-radius: 6px;
      padding: 10px;
      cursor: pointer;
    }
    .checkbox-item.active {
      border-color: #D4AF37;
      background: #1a1a1a;
    }
    .checkbox-item input { width: auto; margin-right: 10px; }
    .checkbox-item label { margin: 0; font-weight: 400; color: #ddd; font-size: 14px; cursor: pointer; }
    button {
      width: 100%;
      padding: 16px;
      background: #D4AF37;
      color: #000;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
      text-transform: uppercase;
    }
    button:hover { background: #e5c158; }
    button:disabled { background: #555; cursor: not-allowed; }
    .success-msg { text-align: center; padding: 20px; }
    .success-msg h1 { color: #D4AF37; font-size: 24px; margin-bottom: 15px; }
    .gold { color: #D4AF37; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container" id="form-container">
    <a href="/" class="close-btn">×</a>
    <img src="IMG_4751.png" class="logo" alt="VaultForge Logo">
    <h1>JOIN BUYER NETWORK</h1>
    <p class="tagline">Get First Look at Off-Market Deals. 48hr Close.</p>
    
    <form id="buyer-form" action="https://formspree.io/f/mqeoeeqe" method="POST">
      <input type="text" name="_gotcha" style="display:none">
      
      <label>Full Name *</label>
      <input type="text" name="full_name" required>
      
      <label>Email *</label>
      <input type="email" name="email" required>
      
      <label>Phone *</label>
      <input type="tel" name="phone" required>
      
      <label>Target States - Tap All That Apply *</label>
      <div class="checkbox-grid" id="states-grid">
        <div class="checkbox-item" data-state="GEORGIA"><input type="checkbox"><label>GEORGIA</label></div>
        <div class="checkbox-item" data-state="TENNESSEE"><input type="checkbox"><label>TENNESSEE</label></div>
        <div class="checkbox-item" data-state="ALABAMA"><input type="checkbox"><label>ALABAMA</label></div>
        <div class="checkbox-item" data-state="FLORIDA"><input type="checkbox"><label>FLORIDA</label></div>
        <div class="checkbox-item" data-state="NORTH CAROLINA"><input type="checkbox"><label>N CAROLINA</label></div>
        <div class="checkbox-item" data-state="SOUTH CAROLINA"><input type="checkbox"><label>S CAROLINA</label></div>
        <div class="checkbox-item" data-state="TEXAS"><input type="checkbox"><label>TEXAS</label></div>
      </div>
      <input type="hidden" name="target_states" id="target_states">
      
      <label>Residential Buy Box</label>
      <div class="checkbox-grid">
        <div class="checkbox-item"><input type="checkbox" name="buy_box_res" value="SFR Fix & Flip"><label>SFR Fix & Flip</label></div>
        <div class="checkbox-item"><input type="checkbox" name="buy_box_res" value="Buy & Hold Rental"><label>Buy & Hold</label></div>
        <div class="checkbox-item"><input type="checkbox" name="buy_box_res" value="BRRRR"><label>BRRRR</label></div>
        <div class="checkbox-item"><input type="checkbox" name="buy_box_res" value="Vacant Land"><label>Vacant Land</label></div>
      </div>
      
      <label>Max Purchase Price - Residential</label>
      <select name="max_price_res">
        <option value="">Select Max Price...</option>
        <option value="100000">$100K</option>
        <option value="250000">$250K</option>
        <option value="500000">$500K</option>
        <option value="750000">$750K</option>
        <option value="1000000">$1M</option>
        <option value="2000000">$2M</option>
        <option value="5000000">$5M+</option>
      </select>
      
      <label>Commercial Buy Box</label>
      <div class="checkbox-grid">
        <div class="checkbox-item"><input type="checkbox" name="buy_box_com" value="Multi-Family 5+"><label>Multi-Family 5+</label></div>
        <div class="checkbox-item"><input type="checkbox" name="buy_box_com" value="Retail"><label>Retail</label></div>
        <div class="checkbox-item"><input type="checkbox" name="buy_box_com" value="Office"><label>Office</label></div>
        <div class="checkbox-item"><input type="checkbox" name="buy_box_com" value="Industrial"><label>Industrial</label></div>
      </div>
      
      <label>Max Purchase Price - Commercial</label>
      <select name="max_price_com">
        <option value="">Select Max Price...</option>
        <option value="500000">$500K</option>
        <option value="1000000">$1M</option>
        <option value="2500000">$2.5M</option>
        <option value="5000000">$5M</option>
        <option value="10000000">$10M</option>
        <option value="25000000">$25M+</option>
      </select>
      
      <label>Land Buy Box</label>
      <div class="checkbox-grid">
        <div class="checkbox-item"><input type="checkbox" name="buy_box_land" value="Residential Lots"><label>Residential Lots</label></div>
        <div class="checkbox-item"><input type="checkbox" name="buy_box_land" value="Commercial Land"><label>Commercial Land</label></div>
        <div class="checkbox-item"><input type="checkbox" name="buy_box_land" value="Agricultural"><label>Agricultural</label></div>
        <div class="checkbox-item"><input type="checkbox" name="buy_box_land" value="Development"><label>Development</label></div>
      </div>
      
      <label>Max Purchase Price - Land</label>
      <select name="max_price_land">
        <option value="">Select Max Price...</option>
        <option value="50000">$50K</option>
        <option value="100000">$100K</option>
        <option value="250000">$250K</option>
        <option value="500000">$500K</option>
        <option value="1000000">$1M+</option>
      </select>
      
      <label>How do you fund deals? *</label>
      <select name="funding" required>
        <option value="">Select...</option>
        <option>Cash</option>
        <option>Hard Money</option>
        <option>Private Lender</option>
        <option>Bank/Conventional</option>
        <option>Other</option>
      </select>
      
      <label>How fast can you close? *</label>
      <select name="close_speed" required>
        <option value="">Select...</option>
        <option>7 days</option>
        <option>14 days</option>
        <option>30 days</option>
        <option>45+ days</option>
      </select>
      
      <button type="submit">JOIN NETWORK + ANALYZE BUY BOX</button>
    </form>
  </div>

<script>
// Multi-tap States
const selectedStates = new Set();
document.querySelectorAll('#states-grid .checkbox-item').forEach(item => {
  item.addEventListener('click', function() {
    const state = this.dataset.state;
    const checkbox = this.querySelector('input');
    if (this.classList.contains('active')) {
      this.classList.remove('active');
      checkbox.checked = false;
      selectedStates.delete(state);
    } else {
      this.classList.add('active');
      checkbox.checked = true;
      selectedStates.add(state);
    }
    document.getElementById('target_states').value = Array.from(selectedStates).join(', ');
  });
});

// Toggle buy box checkboxes
document.querySelectorAll('.checkbox-item').forEach(item => {
  if (item.dataset.state) return; // skip state items
  item.addEventListener('click', function(e) {
    if (e.target.tagName === 'INPUT') return;
    const checkbox = this.querySelector('input');
    checkbox.checked = !checkbox.checked;
    this.classList.toggle('active', checkbox.checked);
  });
});

// Form Submit - Save to database
document.getElementById('buyer-form').addEventListener('submit', function(e) {
  e.preventDefault();
  if (selectedStates.size === 0) {
    alert('Please select at least one Target State');
    return;
  }
  
  const form = e.target;
  const btn = form.querySelector('button');
  btn.disabled = true;
  btn.textContent = 'JOINING NETWORK...';
  
  const formData = new FormData(form);
  const buyerData = Object.fromEntries(formData.entries());
  
  // Save to database first
  fetch('/api/save-buyer', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(buyerData)
  }).then(() => {
    // Then send to Formspree
    return fetch(form.action, {
      method: 'POST',
      body: formData,
      headers: { 'Accept': 'application/json' }
    });
  }).then(response => {
    if (response.ok) {
      document.getElementById('form-container').innerHTML = `
        <div class="success-msg">
          <img src="IMG_4751.png" alt="VaultForge Logo">
          <h1>WELCOME TO THE NETWORK</h1>
          <p class="gold">You're now on the VaultForge Private Buyer List.</p>
          <p>You'll get off-market deals in ${  const btn = form.querySelector('button');
  btn.disabled = true;
  btn.textContent = 'JOINING NETWORK...';

  const formData = new FormData(form);
  const buyerData = Object.fromEntries(formData.entries());

  // Save to database first
  fetch('/api/save-buyer', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(buyerData)
  }).then(() => {
    // Then send to Formspree
    return fetch(form.action, {
      method: 'POST',
      body: formData,
      headers: { 'Accept': 'application/json' }
    });
  }).then(response => {
    if (response.ok) {
      document.getElementById('form-container').innerHTML = `
        <div class="success-msg">
          <img src="IMG_4751.png" alt="VaultForge Logo">
          <h1>WELCOME TO THE NETWORK</h1>
          <p class="gold">You're now on the VaultForge Private Buyer List.</p>
          <p>You'll get off-market deals in ${buyerData.target_states || 'your markets'} that match your buy box.</p>
          <p>48hr first-look before we blast to public.</p>
          <p>Check your email for confirmation.</p>
          <a href="/" class="exit-btn" style="display:inline-block;margin-top:20px;padding:12px 30px;background:#111;border:1px solid #D4AF37;color:#D4AF37;text-decoration:none;border-radius:4px;font-weight:bold;">BACK TO HOME</a>
        </div>
      `;
    } else {
      alert('Error joining network. Please try again.');
      btn.disabled = false;
      btn.textContent = 'JOIN NETWORK + ANALYZE BUY BOX';
    }
  }).catch(error => {
    alert('Network error. Check connection and try again.');
    btn.disabled = false;
    btn.textContent = 'JOIN NETWORK + ANALYZE BUY BOX';
  });
});
</script>
</body>
</html>
