<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultForge - Submit Your Deal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
   .hidden { display: none; }
   .thumbnail { width: 80px; height: 80px; object-fit: cover; }
  </style>
</head>
<body class="bg-zinc-900 text-white">
  <div class="max-w-4xl mx-auto p-4">
    <h1 class="text-3xl font-bold mb-6">Submit Your Deal to VaultForge</h1>
    
    <form id="sellerForm" class="space-y-6">
      <!-- PROPERTY TYPE -->
      <div class="bg-zinc-800 p-4 rounded">
        <label class="block text-sm font-bold mb-2">Property Type *</label>
        <select id="property_type" name="property_type" required class="w-full p-2 bg-zinc-700 rounded">
          <option value="">Select Type</option>
          <option value="Residential">Residential</option>
          <option value="Commercial">Commercial</option>
          <option value="Land">Land</option>
        </select>
      </div>

      <!-- RESIDENTIAL FIELDS -->
      <div id="residential_fields" class="hidden bg-zinc-800 p-4 rounded space-y-4">
        <div>
          <label class="block text-sm font-bold mb-2">Sub-Type</label>
          <select name="res_subtype" class="w-full p-2 bg-zinc-700 rounded">
            <option>Single Family</option>
            <option>Multi-Family</option>
            <option>Condo/Townhome</option>
            <option>Mobile Home</option>
          </select>
        </div>
        <div class="grid grid-cols-3 gap-4">
          <div><label class="block text-sm mb-1">Beds *</label><input type="number" name="bed" class="w-full p-2 bg-zinc-700 rounded"></div>
          <div><label class="block text-sm mb-1">Baths *</label><input type="number" step="0.5" name="bath" class="w-full p-2 bg-zinc-700 rounded"></div>
          <div><label class="block text-sm mb-1">SQFT</label><input type="number" name="sqft" class="w-full p-2 bg-zinc-700 rounded"></div>
        </div>
        <div><label class="block text-sm mb-1">Year Built</label><input type="number" name="year_built" class="w-full p-2 bg-zinc-700 rounded"></div>
      </div>

      <!-- COMMERCIAL FIELDS -->
      <div id="commercial_fields" class="hidden bg-zinc-800 p-4 rounded space-y-4">
        <div>
          <label class="block text-sm font-bold mb-2">Sub-Type</label>
          <select name="com_subtype" class="w-full p-2 bg-zinc-700 rounded">
            <option>Office</option>
            <option>Retail</option>
            <option>Industrial</option>
            <option>Warehouse</option>
            <option>Mixed Use</option>
            <option>Multi-Family 5+</option>
          </select>
        </div>
        <div class="grid grid-cols-3 gap-4">
          <div><label class="block text-sm mb-1">SQFT *</label><input type="number" name="com_sqft" class="w-full p-2 bg-zinc-700 rounded"></div>
          <div><label class="block text-sm mb-1">Units</label><input type="number" name="units" class="w-full p-2 bg-zinc-700 rounded"></div>
          <div><label class="block text-sm mb-1">Acres</label><input type="number" step="0.01" name="com_acres" class="w-full p-2 bg-zinc-700 rounded"></div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="block text-sm mb-1">Zoning</label><input type="text" name="zoning" class="w-full p-2 bg-zinc-700 rounded"></div>
          <div><label class="block text-sm mb-1">Cap Rate %</label><input type="number" step="0.1" name="cap_rate" class="w-full p-2 bg-zinc-700 rounded"></div>
        </div>
      </div>

      <!-- LAND FIELDS -->
      <div id="land_fields" class="hidden bg-zinc-800 p-4 rounded space-y-4">
        <div>
          <label class="block text-sm font-bold mb-2">Sub-Type</label>
          <select name="land_subtype" class="w-full p-2 bg-zinc-700 rounded">
            <option>Residential Lot</option>
            <option>Commercial Lot</option>
            <option>Agricultural</option>
            <option>Recreational</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="block text-sm mb-1">Acres *</label><input type="number" step="0.01" name="acres" class="w-full p-2 bg-zinc-700 rounded"></div>
          <div><label class="block text-sm mb-1">Road Frontage</label>
            <select name="road_frontage" class="w-full p-2 bg-zinc-700 rounded">
              <option value="No">No</option>
              <option value="Yes">Yes</option>
            </select>
            <input type="number" name="frontage_feet" placeholder="Feet" class="w-full p-2 bg-zinc-700 rounded mt-2 hidden">
          </div>
        </div>
        <div class="grid grid-cols-3 gap-4">
          <div><label class="block text-sm mb-1">Power</label>
            <select name="power" class="w-full p-2 bg-zinc-700 rounded">
              <option>None</option><option>At Street</option><option>On Property</option>
            </select>
          </div>
          <div><label class="block text-sm mb-1">Water/Sewer</label>
            <select name="water_sewer" class="w-full p-2 bg-zinc-700 rounded">
              <option>None</option><option>City</option><option>Well/Septic</option>
            </select>
          </div>
          <div><label class="block text-sm mb-1">Topography</label>
            <select name="topography" class="w-full p-2 bg-zinc-700 rounded">
              <option>Flat</option><option>Hilly</option><option>Wooded</option><option>Cleared</option>
            </select>
          </div>
        </div>
        <div><label class="block text-sm mb-1">Zoning</label><input type="text" name="land_zoning" class="w-full p-2 bg-zinc-700 rounded"></div>
      </div>

      <!-- CORE DEAL INFO -->
      <div class="bg-zinc-800 p-4 rounded space-y-4">
        <div><label class="block text-sm font-bold mb-1">Property Address *</label><input type="text" name="address" required class="w-full p-2 bg-zinc-700 rounded"></div>
        <div><label class="block text-sm font-bold mb-1">State *</label><input type="text" name="state" required maxlength="2" class="w-full p-2 bg-zinc-700 rounded"></div>
        <div class="grid grid-cols-3 gap-4">
          <div><label class="block text-sm mb-1">Asking Price *</label><input type="number" name="asking_price" required class="w-full p-2 bg-zinc-700 rounded"></div>
          <div><label class="block text-sm mb-1">ARV *</label><input type="number" name="arv" required class="w-full p-2 bg-zinc-700 rounded"></div>
          <div><label class="block text-sm mb-1">Repairs *</label><input type="number" name="repairs" required class="w-full p-2 bg-zinc-700 rounded"></div>
        </div>
      </div>

      <!-- PHOTO UPLOAD -->
      <div class="bg-zinc-800 p-4 rounded">
        <label class="block text-sm font-bold mb-2">Upload Photos (Max 10)</label>
        <input type="file" id="photos" name="photos" multiple accept="image/*" class="w-full p-2 bg-zinc-700 rounded">
        <div id="photo_preview" class="flex flex-wrap gap-2 mt-4"></div>
      </div>

      <!-- COMPS -->
      <div class="bg-zinc-800 p-4 rounded">
        <label class="block text-sm font-bold mb-2">Comparable Sales (Optional)</label>
        <div id="comps_container" class="space-y-2">
          <div class="comp-row grid grid-cols-4 gap-2">
            <input type="text" name="comp_address[]" placeholder="Address" class="p-2 bg-zinc-700 rounded">
            <input type="number" name="comp_price[]" placeholder="Sale Price" class="p-2 bg-zinc-700 rounded">
            <input type="date" name="comp_date[]" class="p-2 bg-zinc-700 rounded">
            <input type="number" name="comp_sqft[]" placeholder="SQFT" class="p-2 bg-zinc-700 rounded">
          </div>
        </div>
        <button type="button" id="add_comp" class="mt-2 text-sm text-blue-400">+ Add Another Comp</button>
      </div>

      <!-- TITLE CONCIERGE -->
      <div class="bg-zinc-800 p-4 rounded">
        <label class="flex items-center space-x-2 mb-4">
          <input type="checkbox" id="title_concierge" name="title_concierge" class="w-5 h-5">
          <span class="font-bold">Title Concierge - $500 (We handle title + closing)</span>
        </label>
        <div id="title_questions" class="hidden space-y-4">
          <div><label class="block text-sm mb-1">Payoff Amount *</label><input type="number" name="payoff_amount" class="w-full p-2 bg-zinc-700 rounded"></div>
          <div><label class="block text-sm mb-1">Any Liens/Judgments? *</label>
            <select name="liens" class="w-full p-2 bg-zinc-700 rounded"><option>No</option><option>Yes</option></select>
            <input type="text" name="lien_details" placeholder="If yes, describe" class="w-full p-2 bg-zinc-700 rounded mt-2 hidden">
          </div>
          <div><label class="block text-sm mb-1">Desired Closing Date *</label><input type="date" name="closing_date" class="w-full p-2 bg-zinc-700 rounded"></div>
          <div><label class="block text-sm mb-1">Do you have a Title Company? *</label>
            <select name="has_title_co" class="w-full p-2 bg-zinc-700 rounded"><option>No</option><option>Yes</option></select>
            <input type="text" name="title_co_name" placeholder="If yes, name" class="w-full p-2 bg-zinc-700 rounded mt-2 hidden">
          </div>
        </div>
      </div>

      <!-- SELLER INFO -->
      <div class="bg-zinc-800 p-4 rounded space-y-4">
        <div><label class="block text-sm font-bold mb-1">Your Name *</label><input type="text" name="seller_name" required class="w-full p-2 bg-zinc-700 rounded"></div>
        <div><label class="block text-sm font-bold mb-1">Phone *</label><input type="tel" name="seller_phone" required class="w-full p-2 bg-zinc-700 rounded"></div>
        <div><label class="block text-sm font-bold mb-1">Email *</label><input type="email" name="seller_email" required class="w-full p-2 bg-zinc-700 rounded"></div>
      </div>

      <div class="flex gap-4">
        <button type="button" id="analyzeBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 p-4 rounded font-bold disabled:bg-gray-600">ANALYZE DEAL</button>
        <button type="submit" class="flex-1 bg-green-600 hover:bg-green-700 p-4 rounded font-bold disabled:bg-gray-600">SUBMIT TO NETWORK</button>
      </div>
    </form>
  </div>

  <!-- ANALYSIS MODAL -->
  <div id="analysisModal" class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center p-4 z-50">
    <div class="bg-zinc-800 rounded-lg max-w-2xl w-full max-h- overflow-y-auto p-6 relative">
      <button id="closeModal" class="absolute top-4 right-4 text-2xl">✕</button>
      <h2 class="text-2xl font-bold mb-4">Deal Analysis</h2>
      <div id="analysis_content"></div>
    </div>
  </div>

<script>
let currentAnalysis = null;

// Property type toggle
document.getElementById('property_type').addEventListener('change', (e) => {
  document.querySelectorAll('#residential_fields, #commercial_fields, #land_fields').forEach(el => el.classList.add('hidden'));
  document.querySelectorAll('[name="bed"], [name="bath"], [name="com_sqft"], [name="acres"]').forEach(el => el.required = false);
  
  if (e.target.value === 'Residential') {
    document.getElementById('residential_fields').classList.remove('hidden');
    document.querySelector('[name="bed"]').required = true;
    document.querySelector('[name="bath"]').required = true;
  }
  if (e.target.value === 'Commercial') {
    document.getElementById('commercial_fields').classList.remove('hidden');
    document.querySelector('[name="com_sqft"]').required = true;
  }
  if (e.target.value === 'Land') {
    document.getElementById('land_fields').classList.remove('hidden');
    document.querySelector('[name="acres"]').required = true;
  }
});

// Title concierge toggle
document.getElementById('title_concierge').addEventListener('change', (e) => {
  document.getElementById('title_questions').classList.toggle('hidden',!e.target.checked);
  document.querySelectorAll('#title_questions input, #title_questions select').forEach(el => {
    if (el.name!== 'lien_details' && el.name!== 'title_co_name') el.required = e.target.checked;
  });
});

// Photo preview
document.getElementById('photos').addEventListener('change', (e) => {
  const preview = document.getElementById('photo_preview');
  preview.innerHTML = '';
  [...e.target.files].slice(0,10).forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = document.createElement('img');
      img.src = e.target.result;
      img.className = 'thumbnail rounded';
      preview.appendChild(img);
    }
    reader.readAsDataURL(file);
  });
});

// Add comp row
document.getElementById('add_comp').addEventListener('click', () => {
  const container = document.getElementById('comps_container');
  const row = container.querySelector('.comp-row').cloneNode(true);
  row.querySelectorAll('input').forEach(input => input.value = '');
  container.appendChild(row);
});

// Conditional fields
document.querySelector('[name="road_frontage"]').addEventListener('change', (e) => {
  document.querySelector('[name="frontage_feet"]').classList.toggle('hidden', e.target.value!== 'Yes');
});
document.querySelector('[name="liens"]').addEventListener('change', (e) => {
  document.querySelector('[name="lien_details"]').classList.toggle('hidden', e.target.value!== 'Yes');
});
document.querySelector('[name="has_title_co"]').addEventListener('change', (e) => {
  document.querySelector('[name="title_co_name"]').classList.toggle('hidden', e.target.value!== 'Yes');
});

// ANALYZE
document.getElementById('analyzeBtn').addEventListener('click', async () => {
  const form = document.getElementById('sellerForm');
  if (!form.checkValidity()) {
    form.reportValidity();
    return;
  }
  
  const formData = new FormData(form);
  const data = Object.fromEntries(formData);
  
  const btn = document.getElementById('analyzeBtn');
  btn.textContent = 'ANALYZING...';
  btn.disabled = true;
  
  try {
    const res = await fetch('/api/analyze-deal', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error('API Error');
    currentAnalysis = await res.json();
    
    document.getElementById('analysis_content').innerHTML = `
      <div class="grid grid-cols-3 gap-4 mb-6">
        <div class="bg-zinc-700 p-4 rounded text-center">
          <div class="text-3xl font-bold">${currentAnalysis.score}</div>
          <div class="text-sm">Deal Score</div>
        </div>
        <div class="bg-zinc-700 p-4 rounded text-center">
          <div class="text-3xl font-bold">${currentAnalysis.roi}%</div>
          <div class="text-sm">ROI</div>
        </div>
        <div class="bg-zinc-700 p-4 rounded text-center">
          <div class="text-3xl font-bold">$${currentAnalysis.mao.toLocaleString()}</div>
          <div class="text-sm">MAO</div>
        </div>
      </div>
      <h3 class="font-bold mb-2">Comparable Sales</h3>
      <table class="w-full text-sm mb-4">
        <thead><tr class="border-b border-zinc-600"><th class="text-left p-2">Address</th><th>Price</th><th>Sold Date</th><th>SQFT</th></tr></thead>
        <tbody>
          ${currentAnalysis.comps.map(c => `<tr class="border-b border-zinc-700"><td class="p-2">${c.address}</td><td>$${c.price.toLocaleString()}</td><td>${c.sold_date}</td><td>${c.sqft}</td></tr>`).join('')}
        </tbody>
      </table>
      <button type="button" id="submitFromModal" class="w-full bg-green-600 hover:bg-green-700 p-3 rounded font-bold">SUBMIT THIS DEAL TO NETWORK</button>
    `;
    
    document.getElementById('analysisModal').classList.remove('hidden');
    
    document.getElementById('submitFromModal').onclick = () => {
      document.getElementById('sellerForm').requestSubmit();
      document.getElementById('analysisModal').classList.add('hidden');
    };
  } catch (err) {
    alert('Analysis failed. Check that /api/analyze-deal.js is deployed.');
    console.error(err);
  }
  
  btn.textContent = 'ANALYZE DEAL';
  btn.disabled = false;
});

// CLOSE MODAL
document.getElementById('closeModal').addEventListener('click', () => {
  document.getElementById('analysisModal').classList.add('hidden');
});

// SUBMIT
document.getElementById('sellerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(e.target);
  
  if (currentAnalysis) {
    formData.append('analysis', JSON.stringify(currentAnalysis));
  }
  
  const submitBtn = e.target.querySelector('button[type="submit"]');
  submitBtn.textContent = 'SUBMITTING...';
  submitBtn.disabled = true;
  
  try {
    const res = await fetch('/api/save-deal', { method: 'POST', body: formData });
    const data = await res.json();
    
    if (data.stripe_url) {
      window.location.href = data.stripe_url;
    } else if (data.success) {
      alert('Deal submitted! Check your Pain Room.');
      e.target.reset();
      document.getElementById('photo_preview').innerHTML = '';
      currentAnalysis = null;
    } else {
      throw new Error(data.error || 'Unknown error');
    }
  } catch (err) {
    alert('Submit failed. Check that /api/save-deal.js is deployed.');
    console.error(err);
  }
  
  submitBtn.textContent = 'SUBMIT TO NETWORK';
  submitBtn.disabled = false;
});
</script>
</body>
</html>
