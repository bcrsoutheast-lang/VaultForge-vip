<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Property - VaultForge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: 'Arial', sans-serif; padding: 20px; }
   .container { max-width: 600px; margin: 0 auto; }
   .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
   .back-btn { background: none; border: 1px solid #333; color: #FFD700; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; text-decoration: none; }
   .fee-banner { background: #1a1a1a; border: 2px solid #10b981; border-radius: 8px; padding: 15px; margin-bottom: 25px; text-align: center; }
   .fee-banner strong { color: #10b981; }
   .type-display { color: #FFD700; font-size: 20px; font-weight: bold; margin-bottom: 20px; text-align: center; }
   .form-group { margin-bottom: 20px; }
   label { display: block; color: #FFD700; margin-bottom: 8px; font-size: 14px; }
   input, select, textarea { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 6px; font-size: 16px; }
   .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
   .hidden { display: none; }
   .contract-box { background: #1a1a1a; border: 2px solid #FFD700; border-radius: 8px; padding: 15px; margin: 25px 0; }
   .contract-box label { display: flex; align-items: flex-start; gap: 10px; color: #fff; cursor: pointer; font-size: 14px; }
   .contract-box input[type="checkbox"] { width: 20px; height: 20px; margin-top: 2px; flex-shrink: 0; }
   .contract-box a { color: #10b981; text-decoration: underline; }
   .submit-btn { width: 100%; background: #FFD700; color: #000; border: none; padding: 18px; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 10px; }
   .submit-btn:disabled { background: #333; color: #666; cursor: not-allowed; }
   .success-msg { display: none; background: #1a1a1a; border: 2px solid #10b981; border-radius: 8px; padding: 30px; text-align: center; }
   .success-msg h2 { color: #10b981; margin-bottom: 15px; }
   .add-deal-btns { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 20px; }
   .add-deal-btn { background: #1a1a1a; border: 2px solid #FFD700; color: #FFD700; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; display: block; }
   @media (min-width: 500px) { .add-deal-btns { grid-template-columns: 1fr 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <a href="/" class="back-btn">← Back to Home</a>
      <button onclick="window.close()" class="back-btn">Close</button>
    </div>
    
    <div class="fee-banner">
      <strong>50/50 Profit Split at Closing</strong><br>
      You pay $0 upfront. We only get paid if you profit.
    </div>
    
    <div class="type-display" id="typeDisplay">RESIDENTIAL PROPERTY</div>
    
    <form id="sellerForm">
      <input type="hidden" id="propertyType" name="propertyType">
      
      <!-- PROPERTY STATE - YOUR 7 STATES -->
      <div class="form-group">
        <label>Property State *</label>
        <select name="propertyState" required>
          <option value="">Select State</option>
          <option value="GA">Georgia</option>
          <option value="FL">Florida</option>
          <option value="TX">Texas</option>
          <option value="NC">North Carolina</option>
          <option value="SC">South Carolina</option>
          <option value="AL">Alabama</option>
          <option value="TN">Tennessee</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>Property Address *</label>
        <input type="text" name="address" required>
      </div>
      
      <!-- DYNAMIC FIELDS -->
      <div id="residentialFields" class="hidden">
        <div class="grid-2">
          <div class="form-group"><label>Bedrooms</label><input type="number" name="bedrooms"></div>
          <div class="form-group"><label>Bathrooms</label><input type="number" step="0.5" name="bathrooms"></div>
        </div>
        <div class="form-group"><label>Square Feet</label><input type="number" name="sqft"></div>
      </div>
      
      <div id="commercialFields" class="hidden">
        <div class="grid-2">
          <div class="form-group"><label>Units</label><input type="number" name="units"></div>
          <div class="form-group"><label>Cap Rate %</label><input type="number" step="0.1" name="capRate"></div>
        </div>
        <div class="form-group"><label>Total Square Feet</label><input type="number" name="commercialSqft"></div>
        <div class="form-group"><label>NOI (Annual)</label><input type="number" name="noi"></div>
      </div>
      
      <div id="landFields" class="hidden">
        <div class="grid-2">
          <div class="form-group"><label>Acreage *</label><input type="number" step="0.01" name="acreage"></div>
          <div class="form-group"><label>Zoning</label><input type="text" name="zoning"></div>
        </div>
        <div class="form-group">
          <label>Utilities Available</label>
          <select name="utilities"><option value="">Select</option><option>All Utilities</option><option>Water/Electric Only</option><option>None</option></select>
        </div>
      </div>
      
      <div class="grid-2">
        <div class="form-group"><label>Asking Price *</label><input type="number" name="askingPrice" required></div>
        <div class="form-group"><label>ARV *</label><input type="number" name="arv" required></div>
      </div>
      
      <div class="grid-2">
        <div class="form-group"><label>Repairs Needed *</label><input type="number" name="repairs" required></div>
        <div class="form-group"><label>Mortgage Payoff *</label><input type="number" name="mortgage" required></div>
      </div>
      
      <div class="form-group"><label>Why Are You Selling? *</label><textarea name="reason" rows="3" required></textarea></div>
      
      <!-- SELLER CONTACT INFO -->
      <div class="grid-2">
        <div class="form-group"><label>Your Name *</label><input type="text" name="name" required></div>
        <div class="form-group"><label>Phone *</label><input type="tel" name="phone" required></div>
      </div>
      
      <div class="grid-2">
        <div class="form-group"><label>Email *</label><input type="email" name="email" required></div>
        <div class="form-group">
          <label>Your State *</label>
          <select name="sellerState" required>
            <option value="">Select State</option>
            <option value="GA">Georgia</option>
            <option value="FL">Florida</option>
            <option value="TX">Texas</option>
            <option value="NC">North Carolina</option>
            <option value="SC">South Carolina</option>
            <option value="AL">Alabama</option>
            <option value="TN">Tennessee</option>
          </select>
        </div>
      </div>
      
      <!-- 50/50 CHECKBOX -->
      <div class="contract-box">
        <label>
          <input type="checkbox" id="agreeContract" required>
          <span>I agree to the <a href="/50-50-agreement.html" target="_blank">Veteran Pride VaultForge LLC 50/50 Partnership Agreement</a>. I authorize 50% of net profit to be paid to VaultForge at closing.</span>
        </label>
      </div>
      
      <button type="submit" class="submit-btn" id="submitBtn" disabled>SUBMIT DEAL</button>
    </form>
    
    <div class="success-msg" id="successMsg">
      <h2>Deal Submitted!</h2>
      <p>We’re blasting this to 200+ cash buyers now.</p>
      <p><strong>Have another property?</strong></p>
      <div class="add-deal-btns">
        <a href="/sellers.html?type=residential" class="add-deal-btn">RESIDENTIAL</a>
        <a href="/sellers.html?type=commercial" class="add-deal-btn">COMMERCIAL</a>
        <a href="/sellers.html?type=land" class="add-deal-btn">LAND</a>
      </div>
      <a href="/" class="add-deal-btn" style="margin-top: 10px; border-color: #333; color: #ccc;">Back to Home</a>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type') || 'residential';
    document.getElementById('propertyType').value = type;
    document.getElementById('typeDisplay').textContent = type.toUpperCase() + ' PROPERTY';
    document.getElementById(type + 'Fields').classList.remove('hidden');
    
    const checkbox = document.getElementById('agreeContract');
    const submitBtn = document.getElementById('submitBtn');
    checkbox.addEventListener('change', () => { submitBtn.disabled = !checkbox.checked; });
    
    document.getElementById('sellerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('sellerForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    });
  </script>
</body>
</html>
