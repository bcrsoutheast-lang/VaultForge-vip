<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Deal - VaultForge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #0a0a0a; 
      color: #fff; 
      font-family: 'Arial', sans-serif; 
      padding: 20px;
    }
   .container { max-width: 600px; margin: 0 auto; }
    
    /* CLOSE/BACK BUTTON */
   .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
   .back-btn {
      background: none;
      border: 1px solid #333;
      color: #FFD700;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
    }
   .back-btn:hover { background: #1a1a1a; }
    
    /* 50/50 BANNER */
   .fee-banner {
      background: #1a1a1a;
      border: 2px solid #10b981;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 25px;
      text-align: center;
    }
   .fee-banner strong { color: #10b981; }
    
   .form-group { margin-bottom: 20px; }
   label { 
      display: block; 
      color: #FFD700; 
      margin-bottom: 8px; 
      font-size: 14px;
    }
   input, select, textarea { 
      width: 100%; 
      background: #1a1a1a; 
      border: 1px solid #333; 
      color: #fff; 
      padding: 12px; 
      border-radius: 6px; 
      font-size: 16px;
    }
   .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    
    /* CONTRACT CHECKBOX - REQUIRED */
   .contract-box {
      background: #1a1a1a;
      border: 2px solid #FFD700;
      border-radius: 8px;
      padding: 15px;
      margin: 25px 0;
    }
   .contract-box label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }
   .contract-box input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      flex-shrink: 0;
    }
   .contract-box a { color: #10b981; text-decoration: underline; }
    
   .submit-btn {
      width: 100%;
      background: #FFD700;
      color: #000;
      border: none;
      padding: 18px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      margin-top: 10px;
    }
   .submit-btn:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
    }
    
    /* SUCCESS MESSAGE */
   .success-msg {
      display: none;
      background: #1a1a1a;
      border: 2px solid #10b981;
      border-radius: 8px;
      padding: 30px;
      text-align: center;
    }
   .success-msg h2 { color: #10b981; margin-bottom: 15px; }
   .success-msg button {
      background: #FFD700;
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: bold;
      margin: 10px 5px 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- CLOSE/BACK BUTTON -->
    <div class="top-bar">
      <a href="/" class="back-btn">← Back to Home</a>
      <button onclick="window.close()" class="back-btn">Close</button>
    </div>
    
    <!-- 50/50 BANNER -->
    <div class="fee-banner">
      <strong>50/50 Profit Split at Closing</strong><br>
      You pay $0 upfront. We only get paid if you profit.
    </div>
    
    <!-- FORM -->
    <form id="sellerForm">
      <input type="hidden" id="propertyType" name="propertyType">
      
      <div class="grid-2">
        <div class="form-group">
          <label>Bedrooms</label>
          <input type="number" name="bedrooms">
        </div>
        <div class="form-group">
          <label>Bathrooms</label>
          <input type="number" name="bathrooms">
        </div>
      </div>
      
      <div class="form-group">
        <label>Square Feet</label>
        <input type="number" name="sqft">
      </div>
      
      <div class="grid-2">
        <div class="form-group">
          <label>Asking Price *</label>
          <input type="number" name="askingPrice" required>
        </div>
        <div class="form-group">
          <label>ARV *</label>
          <input type="number" name="arv" required>
        </div>
      </div>
      
      <div class="grid-2">
        <div class="form-group">
          <label>Repairs *</label>
          <input type="number" name="repairs" required>
        </div>
        <div class="form-group">
          <label>Mortgage Payoff *</label>
          <input type="number" name="mortgage" required>
        </div>
      </div>
      
      <div class="form-group">
        <label>Why Are You Selling? *</label>
        <textarea name="reason" rows="3" required></textarea>
      </div>
      
      <div class="grid-2">
        <div class="form-group">
          <label>Your Name *</label>
          <input type="text" name="name" required>
        </div>
        <div class="form-group">
          <label>Phone *</label>
          <input type="tel" name="phone" required>
        </div>
      </div>
      
      <div class="form-group">
        <label>Email *</label>
        <input type="email" name="email" required>
      </div>
      
      <!-- CONTRACT CHECKBOX - LEGALLY BINDING -->
      <div class="contract-box">
        <label>
          <input type="checkbox" id="agreeContract" required>
          <span>I agree to the <a href="/50-50-agreement.html" target="_blank">Veteran Pride VaultForge LLC 50/50 Partnership Agreement</a>. I authorize 50% of net profit to be paid to VaultForge at closing.</span>
        </label>
      </div>
      
      <button type="submit" class="submit-btn" id="submitBtn" disabled>SUBMIT DEAL</button>
    </form>
    
    <!-- SUCCESS MESSAGE - SHOWS AFTER SUBMIT -->
    <div class="success-msg" id="successMsg">
      <h2>Deal Submitted!</h2>
      <p>We’re blasting this to 200+ cash buyers now.</p>
      <p>You’ll get offers in 24-48 hours.</p>
      <button onclick="location.reload()">Add Another Deal</button>
      <button onclick="window.location.href='/'">Back to Home</button>
    </div>
    
  </div>

  <script>
    // Auto-check property type from URL
    const urlParams = new URLSearchParams(window.location.search);
    document.getElementById('propertyType').value = urlParams.get('type') || 'residential';
    
    // Enable submit only when checkbox checked
    const checkbox = document.getElementById('agreeContract');
    const submitBtn = document.getElementById('submitBtn');
    checkbox.addEventListener('change', () => {
      submitBtn.disabled = !checkbox.checked;
    });
    
    // Handle form submit
    document.getElementById('sellerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Submit to your API here
      // await fetch('/api/submit-seller', { method: 'POST', body: new FormData(e.target) });
      
      // Hide form, show success
      document.getElementById('sellerForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    });
  </script>
</body>
</html>
