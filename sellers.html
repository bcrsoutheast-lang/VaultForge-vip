<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultForge VIP - Submit Deal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; }
       .container { max-width: 700px; margin: 0 auto; padding: 20px; }
       .header { text-align: center; margin-bottom: 30px; }
       .header h1 { color: #d4af37; font-size: 32px; margin-bottom: 8px; }
       .card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
       .card-label { color: #d4af37; font-size: 14px; font-weight: 700; text-transform: uppercase; margin-bottom: 16px; }
       .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #d4af37; font-weight: 600; font-size: 14px; }
        input, select { width: 100%; padding: 14px; background: #0a0a0a; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: 16px; }
       .radio-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px; }
       .radio-item { background: #0a0a0a; border: 1px solid #333; border-radius: 6px; padding: 14px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; font-weight: 600; }
       .radio-item input { display: none; }
       .radio-item.active { border-color: #d4af37; background: #d4af37; color: #000; }
       .hidden { display: none; }
        button { width: 100%; padding: 18px; background: linear-gradient(135deg, #d4af37, #b8941f); color: #000; border: none; border-radius: 6px; font-size: 18px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
       .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
       .modal.show { display: flex; }
       .modal-content { background: #1a1a1a; border: 2px solid #d4af37; border-radius: 8px; padding: 30px; max-width: 500px; width: 100%; position: relative; }
       .modal-close-x { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #888; font-size: 28px; cursor: pointer; }
       .modal h2 { color: #d4af37; margin-bottom: 20px; text-align: center; }
       .analysis-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #333; }
       .analysis-row:last-child { border: none; }
       .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
       .btn-cancel { background: transparent; border: 1px solid #666; color: #888; }
       .gold { color: #d4af37; font-weight: 600; }
       .checkbox-item { background: #0a0a0a; border: 1px solid #333; border-radius: 6px; padding: 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
       .checkbox-item input { width: 20px; height: 20px; margin: 0; accent-color: #d4af37; }
        @media (max-width: 600px) {.radio-grid { grid-template-columns: 1fr; } .modal-btns { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SUBMIT DEAL</h1>
            <p>Get your deal analyzed + in front of cash buyers</p>
        </div>

        <form id="sellerForm">
            <div class="card">
                <div class="card-label">Property Type</div>
                <div class="radio-grid">
                    <label class="radio-item active"><input type="radio" name="property_type" value="Residential" checked> RESIDENTIAL</label>
                    <label class="radio-item"><input type="radio" name="property_type" value="Commercial"> COMMERCIAL</label>
                    <label class="radio-item"><input type="radio" name="property_type" value="Land"> LAND</label>
                </div>
            </div>

            <div class="card">
                <div class="card-label">Property Details</div>
                <div class="form-group"><label>Address *</label><input type="text" name="address" required></div>
                <div class="form-group"><label>State *</label>
                    <select name="state" required>
                        <option value="">Select State</option>
                        <option value="GA">GEORGIA</option><option value="FL">FLORIDA</option>
                        <option value="TN">TENNESSEE</option><option value="AL">ALABAMA</option>
                        <option value="SC">SOUTH CAROLINA</option>
                    </select>
                </div>
                <div class="form-group"><label>Asking Price *</label><input type="number" name="asking_price" required></div>
                <div class="form-group"><label>ARV *</label><input type="number" name="arv" required></div>
                <div class="form-group"><label>Repair Estimate</label><input type="number" name="repairs" value="0"></div>

                <!-- RESIDENTIAL FIELDS -->
                <div id="res-fields">
                    <div class="form-group"><label>Beds</label><input type="number" name="beds"></div>
                    <div class="form-group"><label>Baths</label><input type="number" name="baths" step="0.5"></div>
                    <div class="form-group"><label>SqFt</label><input type="number" name="sqft"></div>
                    <div class="form-group"><label>Year Built</label><input type="number" name="year_built"></div>
                </div>

                <!-- COMMERCIAL FIELDS -->
                <div id="com-fields" class="hidden">
                    <div class="form-group"><label>SqFt</label><input type="number" name="com_sqft"></div>
                    <div class="form-group"><label>Unit Count</label><input type="number" name="units"></div>
                    <div class="form-group"><label>Cap Rate %</label><input type="number" name="cap_rate" step="0.1"></div>
                    <div class="form-group"><label>NOI Annual</label><input type="number" name="noi"></div>
                </div>

                <!-- LAND FIELDS -->
                <div id="land-fields" class="hidden">
                    <div class="form-group"><label>Acreage *</label><input type="number" name="acres" step="0.01"></div>
                    <div class="form-group"><label>Zoning</label><input type="text" name="zoning"></div>
                    <div class="form-group"><label>Utilities</label><input type="text" name="utilities" placeholder="Water, Sewer, Electric"></div>
                    <div class="form-group"><label>Road Frontage</label><input type="text" name="road_frontage"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-label">Contact + Options</div>
                <div class="form-group"><label>Your Name *</label><input type="text" name="seller_name" required></div>
                <div class="form-group"><label>Phone *</label><input type="tel" name="phone" required></div>
                <div class="form-group"><label>Email *</label><input type="email" name="email" required></div>
                <div class="form-group">
                    <label class="checkbox-item">
                        <input type="checkbox" name="title_concierge"> Add Title Concierge - $500
                    </label>
                    <p style="color: #888; font-size: 13px; margin-top: 8px;">We handle title, payoffs, liens, closing coordination</p>
                </div>
            </div>

            <button type="button" id="analyzeBtn">ANALYZE DEAL</button>
        </form>
    </div>

    <div class="modal" id="analysisModal">
        <div class="modal-content">
            <button class="modal-close-x" onclick="closeAnalysis()">×</button>
            <h2>DEAL ANALYSIS</h2>
            <div id="analysisBody"></div>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeAnalysis()">CANCEL</button>
                <button id="submitDealBtn">SUBMIT TO NETWORK</button>
            </div>
        </div>
    </div>

    <script>
        let currentDeal = {};
        
        // Property type toggle
        document.querySelectorAll('.radio-item input').forEach(radio => {
            radio.addEventListener('change', function() {
                document.querySelectorAll('.radio-item').forEach(i => i.classList.remove('active'));
                this.parentElement.classList.add('active');
                const type = this.value;
                document.getElementById('res-fields').classList.toggle('hidden', type !== 'Residential');
                document.getElementById('com-fields').classList.toggle('hidden', type !== 'Commercial');
                document.getElementById('land-fields').classList.toggle('hidden', type !== 'Land');
            });
        });

        // Analyze button
        document.getElementById('analyzeBtn').addEventListener('click', function() {
            const form = document.getElementById('sellerForm');
            if (!form.checkValidity()) { form.reportValidity(); return; }
            
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            const ask = parseInt(data.asking_price) || 0;
            const arv = parseInt(data.arv) || 0;
            const repairs = parseInt(data.repairs) || 0;
            const mao = (arv * 0.7) - repairs;
            const profit = arv - ask - repairs - 15000;
            const roi = ask > 0 ? ((profit / ask) * 100).toFixed(1) : 0;
            const score = roi > 30 ? 'A' : roi > 20 ? 'B' : roi > 10 ? 'C' : 'D';
            
            currentDeal = { ...data, analysis: { mao, roi: roi + '%', profit, score, ask_vs_mao: ask - mao } };
            
            document.getElementById('analysisBody').innerHTML = `
                <div class="analysis-row"><span>Asking Price</span><span class="gold">$${ask.toLocaleString()}</span></div>
                <div class="analysis-row"><span>ARV</span><span class="gold">$${arv.toLocaleString()}</span></div>
                <div class="analysis-row"><span>Repairs</span><span class="gold">$${repairs.toLocaleString()}</span></div>
                <div class="analysis-row"><span>70% MAO</span><span class="gold">$${mao.toLocaleString()}</span></div>
                <div class="analysis-row"><span>Ask vs MAO</span><span class="gold" style="color:${ask > mao ? '#f87171' : '#4ade80'}">${ask > mao ? '+' : ''}$${(ask - mao).toLocaleString()}</span></div>
                <div class="analysis-row"><span>Est. Profit</span><span class="gold">$${profit.toLocaleString()}</span></div>
                <div class="analysis-row"><span>Projected ROI</span><span class="gold">${roi}%</span></div>
                <div class="analysis-row"><span>Deal Score</span><span class="gold" style="font-size:24px">${score}</span></div>
            `;
            
            document.getElementById('analysisModal').classList.add('show');
        });

        // Submit deal
        document.getElementById('submitDealBtn').addEventListener('click', async function() {
            this.disabled = true; this.textContent = 'SUBMITTING...';
            currentDeal.form_type = 'seller'; currentDeal.created = new Date().toISOString();
            
            try {
                const res = await fetch('/api/save-deal', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(currentDeal)
                });
                const json = await res.json();
                
                if (json.success) {
                    closeAnalysis();
                    if (json.stripe_url) { window.open(json.stripe_url, '_blank'); }
                    alert('Deal submitted to network!');
                    window.location.href = '/';
                } else {
                    alert('Error submitting. Try again.');
                    this.disabled = false; this.textContent = 'SUBMIT TO NETWORK';
                }
            } catch (err) {
                alert('Network error.'); this.disabled = false; this.textContent = 'SUBMIT TO NETWORK';
            }
        });

        function closeAnalysis() {
            document.getElementById('analysisModal').classList.remove('show');
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAnalysis(); });
    </script>
</body>
</html>
