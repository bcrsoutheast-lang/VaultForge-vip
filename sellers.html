<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultForge - Submit Deal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #000; color: #fff; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 32px; }
        .header h1 { color: #FFD700; font-size: 32px; letter-spacing: 2px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
        .card-label { color: #FFD700; font-size: 12px; letter-spacing: 1px; margin-bottom: 16px; text-transform: uppercase; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; color: #ccc; font-size: 14px; margin-bottom: 8px; }
        .form-input, .form-select { width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 4px; color: #fff; font-size: 16px; }
        .form-input:focus, .form-select:focus { outline: none; border-color: #FFD700; }
        .radio-group { display: flex; gap: 16px; }
        .radio-item { display: flex; align-items: center; gap: 8px; }
        .btn { width: 100%; padding: 16px; background: #FFD700; color: #000; border: none; border-radius: 4px; font-size: 16px; font-weight: 700; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; }
        .btn:hover { background: #FFC700; }
        .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
        .checkbox-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: #000; border: 1px solid #333; border-radius: 4px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: #1a1a1a; border: 1px solid #FFD700; border-radius: 8px; padding: 32px; max-width: 500px; width: 90%; position: relative; }
        .modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; color: #FFD700; font-size: 24px; cursor: pointer; }
        .score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 24px 0; }
        .score-box { text-align: center; padding: 16px; background: #000; border: 1px solid #333; border-radius: 4px; }
        .score-label { color: #888; font-size: 12px; margin-bottom: 8px; }
        .score-value { color: #FFD700; font-size: 28px; font-weight: 700; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>VAULTFORGE</h1>
            <p style="color: #888; margin-top: 8px;">Submit Your Off-Market Deal</p>
        </div>

        <form id="dealForm">
            <div class="card">
                <div class="card-label">Property Details</div>
                <div class="form-group">
                    <label class="form-label">Property Type</label>
                    <div class="radio-group">
                        <div class="radio-item">
                            <input type="radio" id="res" name="property_type" value="residential" checked>
                            <label for="res">Residential</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="com" name="property_type" value="commercial">
                            <label for="com">Commercial</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="land" name="property_type" value="land">
                            <label for="land">Land</label>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Property Address</label>
                    <input type="text" id="address" name="address" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">State</label>
                    <select id="state" name="state" class="form-select" required>
                        <option value="">Select State</option>
                        <option>GA</option><option>FL</option><option>TN</option><option>AL</option><option>SC</option>
                    </select>
                </div>
            </div>

            <div class="card">
                <div class="card-label">Deal Numbers</div>
                <div class="form-group">
                    <label class="form-label">Asking Price</label>
                    <input type="number" id="asking_price" name="asking_price" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">After Repair Value (ARV)</label>
                    <input type="number" id="arv" name="arv" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Estimated Repairs</label>
                    <input type="number" id="repairs" name="repairs" class="form-input" value="0">
                </div>
            </div>

            <div class="card">
                <div class="card-label">Services</div>
                <div class="checkbox-item">
                    <input type="checkbox" id="title_concierge" name="title_concierge">
                    <label for="title_concierge">Add Title Concierge - $500</label>
                </div>
                
                <div id="title-questions" class="hidden" style="margin-top:16px; padding:16px; border:1px solid #FFD700; border-radius:8px;">
                    <div class="form-group">
                        <label class="form-label">Current Mortgage Payoff Amount</label>
                        <input type="text" id="payoff_amount" name="payoff_amount" class="form-input" placeholder="$0 if free & clear">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Any liens, judgments, HOA, or back taxes?</label>
                        <select id="has_liens" name="has_liens" class="form-select">
                            <option>No</option><option>Yes</option>
                        </select>
                        <input type="text" id="lien_details" name="lien_details" class="form-input" placeholder="Describe if yes" style="margin-top:8px; display:none;">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Preferred closing date</label>
                        <input type="date" id="closing_date" name="closing_date" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Do you have a title company?</label>
                        <select id="has_title_company" name="has_title_company" class="form-select">
                            <option>No</option><option>Yes</option>
                        </select>
                        <input type="text" id="title_company" name="title_company" class="form-input" placeholder="Company name" style="margin-top:8px; display:none;">
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-label">Contact Info</div>
                <div class="form-group">
                    <label class="form-label">Your Name</label>
                    <input type="text" id="seller_name" name="seller_name" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Phone</label>
                    <input type="tel" id="seller_phone" name="seller_phone" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="seller_email" name="seller_email" class="form-input" required>
                </div>
            </div>

            <button type="button" id="analyzeBtn" class="btn">ANALYZE DEAL</button>
        </form>
    </div>

    <div id="analysisModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2 style="color: #FFD700; text-align: center; margin-bottom: 24px;">DEAL ANALYSIS</h2>
            <div class="score-grid">
                <div class="score-box">
                    <div class="score-label">SCORE</div>
                    <div class="score-value" id="modalScore">-</div>
                </div>
                <div class="score-box">
                    <div class="score-label">ROI</div>
                    <div class="score-value" id="modalRoi">-</div>
                </div>
                <div class="score-box">
                    <div class="score-label">MAO</div>
                    <div class="score-value" id="modalMao">-</div>
                </div>
            </div>
            <button type="button" id="submitDealBtn" class="btn">SUBMIT TO NETWORK</button>
        </div>
    </div>

    <script>
        let currentDeal = {};
        
        document.getElementById('title_concierge').addEventListener('change', function(e) {
            document.getElementById('title-questions').style.display = e.target.checked ? 'block' : 'none';
        });

        document.getElementById('has_liens').addEventListener('change', e => {
            document.getElementById('lien_details').style.display = e.target.value === 'Yes' ? 'block' : 'none';
        });
        
        document.getElementById('has_title_company').addEventListener('change', e => {
            document.getElementById('title_company').style.display = e.target.value === 'Yes' ? 'block' : 'none';
        });

        document.getElementById('analyzeBtn').addEventListener('click', async function() {
            const form = document.getElementById('dealForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            data.title_concierge = document.getElementById('title_concierge').checked;
            
            this.disabled = true;
            this.textContent = 'ANALYZING...';

            try {
                const res = await fetch('/api/analyze-deal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const json = await res.json();
                
                currentDeal = { ...data, analysis: json };
                document.getElementById('modalScore').textContent = json.score;
                document.getElementById('modalRoi').textContent = json.roi + '%';
                document.getElementById('modalMao').textContent = '$' + json.mao.toLocaleString();
                document.getElementById('analysisModal').style.display = 'flex';
            } catch (err) {
                alert('Analysis failed. Try again.');
            } finally {
                this.disabled = false;
                this.textContent = 'ANALYZE DEAL';
            }
        });

        document.getElementById('submitDealBtn').addEventListener('click', async function() {
            this.disabled = true;
            this.textContent = 'SUBMITTING...';

            try {
                const res = await fetch('/api/save-deal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentDeal)
                });
                const json = await res.json();
                
                if (json.success && json.stripe_url) {
                    window.open(json.stripe_url, '_blank');
                }
                
                alert('Deal submitted to network!');
                closeModal();
                document.getElementById('dealForm').reset();
                document.getElementById('title-questions').style.display = 'none';
            } catch (err) {
                alert('Submit failed. Try again.');
            } finally {
                this.disabled = false;
                this.textContent = 'SUBMIT TO NETWORK';
            }
        });

        function closeModal() {
            document.getElementById('analysisModal').style.display = 'none';
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
