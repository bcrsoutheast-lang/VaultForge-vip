<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultForge - Submit Deal</title>
  <style>
    body { background:#0a0a0a; color:#fff; font-family:system-ui; padding:20px; max-width:600px; margin:0 auto; }
    input, textarea, select { width:100%; padding:12px; margin:8px 0 16px; background:#1a1a1a; border:1px solid #333; color:#fff; border-radius:6px; font-size:16px; }
    button { background:#FFD700; color:#000; padding:14px 28px; border:none; border-radius:6px; font-weight:700; font-size:16px; cursor:pointer; width:100%; }
    button:disabled { opacity:0.5; cursor:not-allowed; }
    label { font-weight:600; display:block; margin-top:12px; }
   .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
   .result { background:#1a1a1a; padding:16px; border-radius:6px; margin:16px 0; border:1px solid #333; }
   .grade { font-size:24px; font-weight:900; }
   .error { background:#3a0000; color:#ff6b6b; padding:12px; border-radius:6px; margin:12px 0; }
  </style>
</head>
<body>
  <h1>Submit Your Property</h1>
  <form id="dealForm" enctype="multipart/form-data">
    <label>Property Address *</label>
    <input type="text" id="address" name="address" placeholder="121 Bowdoin Ln" required>
    
    <div class="grid">
      <div>
        <label>State *</label>
        <select id="state" name="state" required>
          <option value="">Select</option>
          <option value="GA">GA</option>
          <option value="FL">FL</option>
          <option value="AL">AL</option>
          <option value="SC">SC</option>
          <option value="TN">TN</option>
          <option value="NC">NC</option>
        </select>
      </div>
      <div>
        <label>Zip *</label>
        <input type="text" id="zip" name="zip" placeholder="30303" required>
      </div>
    </div>

    <div class="grid">
      <div>
        <label>Asking Price *</label>
        <input type="text" inputmode="numeric" id="ask" name="ask" placeholder="125,000" required>
      </div>
      <div>
        <label>ARV *</label>
        <input type="text" inputmode="numeric" id="arv" name="arv" placeholder="185,000" required>
      </div>
    </div>

    <div class="grid">
      <div>
        <label>Repairs *</label>
        <input type="text" inputmode="numeric" id="repairs" name="repairs" placeholder="10,000" required>
      </div>
      <div>
        <label>Mortgage Payoff *</label>
        <input type="text" inputmode="numeric" id="payoff" name="payoff" placeholder="80,000" required>
      </div>
    </div>

    <label>Why Are You Selling? *</label>
    <textarea id="reason" name="reason" rows="3" placeholder="Motivated, inherited, etc" required></textarea>

    <label>Property Photos</label>
    <input type="file" id="photos" name="photos" multiple accept="image/*">

    <div id="result" class="result" style="display:none;"></div>
    <div id="error" class="error" style="display:none;"></div>

    <button type="submit" id="submitBtn">SUBMIT TO NETWORK</button>
  </form>

<script>
// Auto-add commas while typing
['ask','arv','repairs','payoff'].forEach(id => {
  document.getElementById(id).addEventListener('input', function(e) {
    let val = e.target.value.replace(/[^0-9]/g, '');
    if(val) e.target.value = Number(val).toLocaleString();
  });
});

// Live analyzer
let debounce;
['ask','arv','repairs','payoff'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(runAnalysis, 500);
  });
});

async function runAnalysis() {
  const data = getFormData();
  if(!data.ask ||!data.arv ||!data.repairs) return;
  
  try {
    const res = await fetch('/api/analyze-deal', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    const json = await res.json();
    const r = document.getElementById('result');
    r.style.display = 'block';
    r.innerHTML = `
      <div class="grade">Grade: ${json.grade}</div>
      <div>MAO: $${Number(json.mao).toLocaleString()}</div>
      <div>Equity Spread: $${Number(json.equity).toLocaleString()}</div>
      <div>${json.askDiff >= 0? '+' : ''}$${Number(json.askDiff).toLocaleString()} vs Ask</div>
      <div style="margin-top:8px; font-size:14px; color:#999;">${json.message}</div>
    `;
  } catch(e) {
    console.log('Analysis failed', e);
  }
}

function getFormData() {
  const strip = v => Number(v.replace(/[^0-9]/g, '')) || 0;
  return {
    address: document.getElementById('address').value,
    state: document.getElementById('state').value,
    zip: document.getElementById('zip').value,
    ask: strip(document.getElementById('ask').value),
    arv: strip(document.getElementById('arv').value),
    repairs: strip(document.getElementById('repairs').value),
    payoff: strip(document.getElementById('payoff').value),
    reason: document.getElementById('reason').value
  };
}

// Submit handler
document.getElementById('dealForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('error');
  err.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'SUBMITTING...';

  // Strip commas + $ before submit
  ['ask','arv','repairs','payoff'].forEach(id => {
    const el = document.getElementById(id);
    el.value = el.value.replace(/[$,]/g, '');
  });

  const formData = new FormData(e.target);
  
  try {
    const res = await fetch('/api/save-deal', {
      method: 'POST',
      body: formData
    });
    const json = await res.json();
    if(!res.ok) throw new Error(json.error || 'Submit failed');
    window.location.href = `/success?deal=${json.id}`;
  } catch(error) {
    err.textContent = `Submit failed: ${error.message}`;
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'SUBMIT TO NETWORK';
  }
});
</script>
</body>
</html>
