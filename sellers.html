<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Property - VaultForge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: 'Arial', sans-serif; padding: 20px; }
   .container { max-width: 500px; margin: 0 auto; }
    h1 { color: #FFD700; margin-bottom: 20px; text-align: center; }
   .form-group { margin-bottom: 15px; }
    label { display: block; color: #ccc; margin-bottom: 5px; font-size: 14px; }
    input, select, textarea { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 4px; font-size: 16px; }
    textarea { min-height: 80px; }
   .btn { width: 100%; background: #FFD700; color: #000; border: none; padding: 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 18px; margin-top: 10px; }
   .btn:hover { opacity: 0.8; }
   .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Submit Your Property</h1>
    <form id="sellerForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="full_name" required>
      </div>
      <div class="grid">
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" name="phone" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required>
        </div>
      </div>
      <div class="form-group">
        <label>Property Address</label>
        <input type="text" name="property_address" required>
      </div>
      <div class="grid">
        <div class="form-group">
          <label>City</label>
          <input type="text" name="city" required>
        </div>
        <div class="form-group">
          <label>State</label>
          <input type="text" name="state" required>
        </div>
      </div>
      <div class="grid">
        <div class="form-group">
          <label>Zip</label>
          <input type="text" name="zip">
        </div>
        <div class="form-group">
          <label>Property Type</label>
          <select name="property_type">
            <option>Residential</option>
            <option>Commercial</option>
            <option>Land</option>
          </select>
        </div>
      </div>
      <div class="grid">
        <div class="form-group">
          <label>Beds</label>
          <input type="number" name="beds">
        </div>
        <div class="form-group">
          <label>Baths</label>
          <input type="number" step="0.5" name="baths">
        </div>
      </div>
      <div class="grid">
        <div class="form-group">
          <label>Sq Ft</label>
          <input type="number" name="sqft">
        </div>
        <div class="form-group">
          <label>Asking Price</label>
          <input type="number" name="asking_price">
        </div>
      </div>
      <div class="grid">
        <div class="form-group">
          <label>ARV</label>
          <input type="number" name="arv">
        </div>
        <div class="form-group">
          <label>Rehab Estimate</label>
          <input type="number" name="rehab_estimate">
        </div>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea name="notes"></textarea>
      </div>
      <button type="submit" class="btn">SUBMIT DEAL</button>
    </form>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseUrl = 'YOUR_SUPABASE_URL';
const supabaseKey = 'YOUR_SUPABASE_ANON_KEY';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

const urlParams = new URLSearchParams(window.location.search);
const type = urlParams.get('type');
if (type) document.querySelector('[name="property_type"]').value = type.charAt(0).toUpperCase() + type.slice(1);

document.getElementById('sellerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(e.target);
  
  const sellerData = {
    full_name: formData.get('full_name'),
    phone: formData.get('phone'),
    email: formData.get('email'),
    property_address: formData.get('property_address'),
    city: formData.get('city'),
    state: formData.get('state'),
    zip: formData.get('zip'),
    property_type: formData.get('property_type'),
    beds: formData.get('beds')? parseInt(formData.get('beds')) : null,
    baths: formData.get('baths')? parseFloat(formData.get('baths')) : null,
    sqft: formData.get('sqft')? parseInt(formData.get('sqft')) : null,
    asking_price: formData.get('asking_price')? parseInt(formData.get('asking_price')) : null,
    arv: formData.get('arv')? parseInt(formData.get('arv')) : null,
    rehab_estimate: formData.get('rehab_estimate')? parseInt(formData.get('rehab_estimate')) : null,
    notes: formData.get('notes')
  };

  const { data: seller, error: sellerError } = await supabase
  .from('sellers')
  .insert([sellerData])
  .select()
  .single();

  if (sellerError) {
    alert('Error: ' + sellerError.message);
    return;
  }

  const dealData = {
    seller_id: seller.id,
    city: sellerData.city,
    state: sellerData.state,
    property_type: sellerData.property_type,
    beds: sellerData.beds,
    baths: sellerData.baths,
    sqft: sellerData.sqft,
    asking_price: sellerData.asking_price,
    arv: sellerData.arv,
    rehab_estimate: sellerData.rehab_estimate,
    status: 'New'
  };

  await supabase.from('deals').insert([dealData]);
  alert('Deal submitted. We will contact you within 24 hours.');
  e.target.reset();
});
</script>
</body>
</html>
