<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Property - VaultForge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: Arial, sans-serif; padding: 20px; padding-bottom: 120px; }
.container { max-width: 500px; margin: 0 auto; }
.back-btn { color: #FFD700; text-decoration: none; font-size: 16px; margin-bottom: 20px; display: inline-block; }
    h1 { color: #FFD700; margin-bottom: 20px; text-align: center; }
.form-group { margin-bottom: 15px; }
    label { display: block; color: #ccc; margin-bottom: 5px; font-size: 14px; }
    input, select, textarea { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 4px; font-size: 16px; }
    textarea { min-height: 80px; }
.btn { width: 100%; background: #FFD700; color: #000; border: none; padding: 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 18px; margin-top: 10px; text-decoration: none; display: block; text-align: center; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.checkbox-row { display: flex; align-items: flex-start; gap: 10px; margin: 20px 0; }
.checkbox-row input { width: 20px; height: 20px; margin-top: 2px; flex-shrink: 0; }
.checkbox-row label { color: #FFD700; font-size: 14px; line-height: 1.4; }
.success { display: none; text-align: center; padding: 40px 20px; }
.success h2 { color: #10b981; margin-bottom: 15px; font-size: 24px; }
.success p { color: #ccc; margin-bottom: 25px; line-height: 1.6; }
.dynamic { display: none; }
.section-title { color: #FFD700; font-size: 16px; margin: 25px 0 10px 0; border-bottom: 1px solid #333; padding-bottom: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <a href="./index.html" class="back-btn">← Back</a>
    <div id="formWrap">
      <h1>Submit Your Property</h1>
      <form id="sellerForm">
        <div class="form-group">
          <label>Property Type</label>
          <select name="property_type" id="propType" required onchange="showFields()">
            <option value="">Select Property Type</option>
            <option value="Residential">Residential</option>
            <option value="Commercial">Commercial</option>
            <option value="Land">Land</option>
          </select>
        </div>

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="full_name" required>
        </div>
        <div class="grid">
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" name="phone" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
          </div>
        </div>
        <div class="form-group">
          <label>Property Address</label>
          <input type="text" name="property_address" required>
        </div>
        <div class="grid">
          <div class="form-group">
            <label>City</label>
            <input type="text" name="city" required>
          </div>
          <div class="form-group">
            <label>State</label>
            <select name="state" required>
              <option value="">Select State</option>
              <option value="AL">Alabama</option><option value="AK">Alaska</option><option value="AZ">Arizona</option><option value="AR">Arkansas</option>
              <option value="CA">California</option><option value="CO">Colorado</option><option value="CT">Connecticut</option><option value="DE">Delaware</option>
              <option value="FL">Florida</option><option value="GA">Georgia</option><option value="HI">Hawaii</option><option value="ID">Idaho</option>
              <option value="IL">Illinois</option><option value="IN">Indiana</option><option value="IA">Iowa</option><option value="KS">Kansas</option>
              <option value="KY">Kentucky</option><option value="LA">Louisiana</option><option value="ME">Maine</option><option value="MD">Maryland</option>
              <option value="MA">Massachusetts</option><option value="MI">Michigan</option><option value="MN">Minnesota</option><option value="MS">Mississippi</option>
              <option value="MO">Missouri</option><option value="MT">Montana</option><option value="NE">Nebraska</option><option value="NV">Nevada</option>
              <option value="NH">New Hampshire</option><option value="NJ">New Jersey</option><option value="NM">New Mexico</option><option value="NY">New York</option>
              <option value="NC">North Carolina</option><option value="ND">North Dakota</option><option value="OH">Ohio</option><option value="OK">Oklahoma</option>
              <option value="OR">Oregon</option><option value="PA">Pennsylvania</option><option value="RI">Rhode Island</option><option value="SC">South Carolina</option>
              <option value="SD">South Dakota</option><option value="TN">Tennessee</option><option value="TX">Texas</option><option value="UT">Utah</option>
              <option value="VT">Vermont</option><option value="VA">Virginia</option><option value="WA">Washington</option><option value="WV">West Virginia</option>
              <option value="WI">Wisconsin</option><option value="WY">Wyoming</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Zip</label>
          <input type="text" name="zip">
        </div>

        <div id="resFields" class="dynamic">
          <div class="section-title">Residential Details</div>
          <div class="grid">
            <div class="form-group"><label>Beds</label><input type="number" name="beds"></div>
            <div class="form-group"><label>Baths</label><input type="number" name="baths"></div>
          </div>
          <div class="grid">
            <div class="form-group"><label>SqFt</label><input type="number" name="sqft"></div>
            <div class="form-group"><label>Year Built</label><input type="number" name="year_built"></div>
          </div>
        </div>

        <div id="comFields" class="dynamic">
          <div class="section-title">Commercial Details</div>
          <div class="grid">
            <div class="form-group"><label>Units</label><input type="number" name="units"></div>
            <div class="form-group"><label>Total SqFt</label><input type="number" name="total_sqft"></div>
          </div>
          <div class="grid">
            <div class="form-group"><label>Annual NOI</label><input type="number" name="noi"></div>
            <div class="form-group"><label>Cap Rate %</label><input type="number" name="cap_rate" step="0.1"></div>
          </div>
          <div class="form-group"><label>Occupancy %</label><input type="number" name="occupancy"></div>
        </div>

        <div id="landFields" class="dynamic">
          <div class="section-title">Land Details</div>
          <div class="grid">
            <div class="form-group"><label>Acres</label><input type="number" name="acres" step="0.01"></div>
            <div class="form-group"><label>Zoning</label><input type="text" name="zoning"></div>
          </div>
          <div class="form-group"><label>Utilities</label><input type="text" name="utilities" placeholder="Water, Sewer, Electric"></div>
        </div>

        <div class="grid">
          <div class="form-group">
            <label>Asking Price</label>
            <input type="number" name="asking_price">
          </div>
          <div class="form-group">
            <label>ARV</label>
            <input type="number" name="arv">
          </div>
        </div>
        <div class="form-group">
          <label>Rehab Estimate</label>
          <input type="number" name="rehab_estimate">
        </div>
        <div class="form-group">
          <label>Notes</label>
          <textarea name="notes"></textarea>
        </div>
        <div class="form-group">
          <label>Property Photos</label>
          <input type="file" name="photos" multiple accept="image/*">
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="agree5050" required>
          <label for="agree5050">I agree to 50/50 profit split at closing with Veteran Pride VaultForge LLC. I understand VaultForge only gets paid if I profit.</label>
        </div>
        <button type="submit" class="btn">SUBMIT DEAL</button>
      </form>
    </div>
    <div id="success" class="success">
      <h2>Deal Under Review</h2>
      <p>Your deal is being reviewed. We will contact you within 24 hours with a 50/50 profit split contract.</p>
      <a href="./sellers.html" class="btn">Submit Another Deal</a>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseUrl = 'https://cnxrwnxtpfxoyjymuwvs.supabase.co';
const supabaseKey = 'sb_publishable_t-QviJYrFalcqFST7igSQw_9JbkCeXX';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

function showFields() {
  const type = document.getElementById('propType').value;
  document.getElementById('resFields').style.display = 'none';
  document.getElementById('comFields').style.display = 'none';
  document.getElementById('landFields').style.display = 'none';
  if(type === 'Residential') document.getElementById('resFields').style.display = 'block';
  if(type === 'Commercial') document.getElementById('comFields').style.display = 'block';
  if(type === 'Land') document.getElementById('landFields').style.display = 'block';
}

document.getElementById('sellerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(e.target);
  const files = formData.getAll('photos');
  
  const sellerData = {
    full_name: formData.get('full_name'),
    phone: formData.get('phone'),
    email: formData.get('email'),
    property_address: formData.get('property_address'),
    city: formData.get('city'),
    state: formData.get('state'),
    zip: formData.get('zip'),
    property_type: formData.get('property_type'),
    asking_price: formData.get('asking_price')? parseInt(formData.get('asking_price')) : null,
    arv: formData.get('arv')? parseInt(formData.get('arv')) : null,
    rehab_estimate: formData.get('rehab_estimate')? parseInt(formData.get('rehab_estimate')) : null,
    notes: formData.get('notes'),
    beds: formData.get('beds')? parseInt(formData.get('beds')) : null,
    baths: formData.get('baths')? parseInt(formData.get('baths')) : null,
    sqft: formData.get('sqft')? parseInt(formData.get('sqft')) : null,
    year_built: formData.get('year_built')? parseInt(formData.get('year_built')) : null,
    units: formData.get('units')? parseInt(formData.get('units')) : null,
    total_sqft: formData.get('total_sqft')? parseInt(formData.get('total_sqft')) : null,
    noi: formData.get('noi')? parseInt(formData.get('noi')) : null,
    cap_rate: formData.get('cap_rate')? parseFloat(formData.get('cap_rate')) : null,
    occupancy: formData.get('occupancy')? parseInt(formData.get('occupancy')) : null,
    acres: formData.get('acres')? parseFloat(formData.get('acres')) : null,
    zoning: formData.get('zoning'),
    utilities: formData.get('utilities')
  };

  const { data: seller, error: sellerError } = await supabase.from('sellers').insert([sellerData]).select().single();
  if (sellerError) {
    alert('Error: ' + sellerError.message);
    return;
  }

  let photoUrls = [];
  for (const file of files) {
    if (file.size > 0) {
      const fileName = `${seller.id}/${Date.now()}-${file.name}`;
      const { error: uploadError } = await supabase.storage.from('deal-photos').upload(fileName, file);
      if (!uploadError) {
        const { data: urlData } = supabase.storage.from('deal-photos').getPublicUrl(fileName);
        photoUrls.push(urlData.publicUrl);
      }
    }
  }

  const dealData = {
    seller_id: seller.id,
    city: sellerData.city,
    state: sellerData.state,
    property_type: sellerData.property_type,
    asking_price: sellerData.asking_price,
    arv: sellerData.arv,
    rehab_estimate: sellerData.rehab_estimate,
    photos: photoUrls,
    status: 'New'
  };

  await supabase.from('deals').insert([dealData]);
  document.getElementById('formWrap').style.display = 'none';
  document.getElementById('success').style.display = 'block';
});
</script>
</body>
</html>
