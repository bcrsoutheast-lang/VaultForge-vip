<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultForge VIP - Submit Your Deal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a; 
            color: #fff; 
            line-height: 1.6;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #d4af37; font-size: 28px; margin-bottom: 8px; }
        .header p { color: #888; font-size: 16px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #d4af37; font-weight: 600; }
        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            background: #1a1a1a; 
            border: 1px solid #333; 
            border-radius: 6px; 
            color: #fff; 
            font-size: 16px;
        }
        input:focus, select:focus, textarea:focus { 
            outline: none; 
            border-color: #d4af37; 
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
        }
        .checkbox-group { 
            background: #1a1a1a; 
            border: 1px solid #333; 
            border-radius: 6px; 
            padding: 16px; 
            margin-bottom: 20px;
        }
        .checkbox-label { 
            display: flex; 
            align-items: flex-start; 
            gap: 12px; 
            cursor: pointer;
            color: #fff;
            font-weight: normal;
        }
        .checkbox-label input[type="checkbox"] { 
            width: 20px; 
            height: 20px; 
            margin: 0;
            cursor: pointer;
        }
        .checkbox-text { flex: 1; }
        .checkbox-title { color: #d4af37; font-weight: 600; display: block; margin-bottom: 4px; }
        .checkbox-desc { color: #888; font-size: 14px; }
        .title-fields { 
            display: none; 
            margin-top: 16px; 
            padding-top: 16px; 
            border-top: 1px solid #333;
        }
        .title-fields.show { display: block; }
        .conditional-field { display: none; margin-top: 12px; }
        .conditional-field.show { display: block; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        button { 
            width: 100%; 
            padding: 16px; 
            background: linear-gradient(135deg, #d4af37, #b8941f); 
            color: #000; 
            border: none; 
            border-radius: 6px; 
            font-size: 18px; 
            font-weight: 700; 
            cursor: pointer;
            text-transform: uppercase;
        }
        button:hover { opacity: 0.9; }
        .success { 
            display: none; 
            background: #1a4d1a; 
            border: 1px solid #2d7d2d; 
            color: #4ade80; 
            padding: 20px; 
            border-radius: 6px; 
            text-align: center;
            margin-top: 20px;
        }
        @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>VAULTFORGE VIP</h1>
            <p>Submit your deal to our buyer network</p>
        </div>

        <form id="sellerForm">
            <div class="form-group">
                <label>Property Address *</label>
                <input type="text" name="address" required placeholder="123 Main St">
            </div>

            <div class="row">
                <div class="form-group">
                    <label>City *</label>
                    <input type="text" name="city" required placeholder="Atlanta">
                </div>
                <div class="form-group">
                    <label>State *</label>
                    <select name="state" required>
                        <option value="">Select State</option>
                        <option value="GA">Georgia</option>
                        <option value="FL">Florida</option>
                        <option value="TN">Tennessee</option>
                        <option value="AL">Alabama</option>
                        <option value="SC">South Carolina</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Asking Price *</label>
                    <input type="number" name="asking_price" required placeholder="150000">
                </div>
                <div class="form-group">
                    <label>ARV</label>
                    <input type="number" name="arv" placeholder="200000">
                </div>
            </div>

            <div class="form-group">
                <label>Estimated Repairs</label>
                <input type="number" name="repairs" placeholder="25000">
            </div>

            <div class="form-group">
                <label>Deal Type *</label>
                <select name="deal_type" required>
                    <option value="">Select Type</option>
                    <option value="Assignment">Assignment</option>
                    <option value="Double Close">Double Close</option>
                    <option value="Subject To">Subject To</option>
                    <option value="Seller Finance">Seller Finance</option>
                </select>
            </div>

            <div class="form-group">
                <label>Expected Assignment Fee</label>
                <input type="number" name="expected_fee" placeholder="10000">
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Your Name *</label>
                    <input type="text" name="seller_name" required placeholder="John Smith">
                </div>
                <div class="form-group">
                    <label>Phone *</label>
                    <input type="tel" name="phone" required placeholder="404-555-1234">
                </div>
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" name="email" required placeholder="john@email.com">
            </div>

            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="title_concierge" id="titleConcierge">
                    <div class="checkbox-text">
                        <span class="checkbox-title">Add Title Concierge - $500</span>
                        <span class="checkbox-desc">We handle title, payoffs, liens, and closing coordination so you don't have to chase anyone</span>
                    </div>
                </label>

                <div class="title-fields" id="titleFields">
                    <div class="form-group">
                        <label>Is there a mortgage on the property? *</label>
                        <select name="has_mortgage" id="hasMortgage">
                            <option value="">Select</option>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>

                    <div class="conditional-field" id="mortgageFields">
                        <div class="row">
                            <div class="form-group">
                                <label>Lender Name *</label>
                                <input type="text" name="lender_name" placeholder="Wells Fargo">
                            </div>
                            <div class="form-group">
                                <label>Approx Payoff Balance *</label>
                                <input type="number" name="payoff_balance" placeholder="85000">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Any known title issues? Liens, judgments, divorce, probate, heirship? *</label>
                        <select name="has_title_issues" id="hasTitleIssues">
                            <option value="">Select</option>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>

                    <div class="conditional-field" id="titleIssueField">
                        <div class="form-group">
                            <label>Explain briefly *</label>
                            <textarea name="title_issue_details" rows="3" placeholder="Divorce decree needed, 2021 IRS lien, etc"></textarea>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Exact name as it appears on deed *</label>
                        <input type="text" name="deed_name" placeholder="John A. Smith Revocable Trust">
                    </div>
                </div>
            </div>

            <button type="submit">Submit Deal to Network</button>
        </form>

        <div class="success" id="successMsg">
            <h3>Deal Submitted!</h3>
            <p>Check your email for next steps. If you selected Title Concierge, you'll be redirected to payment.</p>
        </div>
    </div>

    <script>
        const titleConcierge = document.getElementById('titleConcierge');
        const titleFields = document.getElementById('titleFields');
        const hasMortgage = document.getElementById('hasMortgage');
        const mortgageFields = document.getElementById('mortgageFields');
        const hasTitleIssues = document.getElementById('hasTitleIssues');
        const titleIssueField = document.getElementById('titleIssueField');
        const form = document.getElementById('sellerForm');
        const successMsg = document.getElementById('successMsg');

        titleConcierge.addEventListener('change', function() {
            titleFields.classList.toggle('show', this.checked);
            if (!this.checked) {
                document.querySelectorAll('#titleFields input, #titleFields select, #titleFields textarea').forEach(el => {
                    el.required = false;
                    if (el.type === 'checkbox' || el.type === 'radio') el.checked = false;
                    else el.value = '';
                });
                mortgageFields.classList.remove('show');
                titleIssueField.classList.remove('show');
            } else {
                document.querySelector('#hasMortgage').required = true;
                document.querySelector('#hasTitleIssues').required = true;
                document.querySelector('input[name="deed_name"]').required = true;
            }
        });

        hasMortgage.addEventListener('change', function() {
            const show = this.value === 'Yes';
            mortgageFields.classList.toggle('show', show);
            mortgageFields.querySelectorAll('input').forEach(el => el.required = show);
        });

        hasTitleIssues.addEventListener('change', function() {
            const show = this.value === 'Yes';
            titleIssueField.classList.toggle('show', show);
            titleIssueField.querySelector('textarea').required = show;
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            data.title_concierge = titleConcierge.checked;
            
            try {
                const res = await fetch('/api/save-deal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (res.ok) {
                    const result = await res.json();
                    if (data.title_concierge && result.stripe_url) {
                        window.location.href = result.stripe_url;
                    } else {
                        form.style.display = 'none';
                        successMsg.style.display = 'block';
                    }
                } else {
                    alert('Error submitting deal. Please try again.');
                }
            } catch (err) {
                alert('Error submitting deal. Please try again.');
            }
        });
    </script>
</body>
</html>
