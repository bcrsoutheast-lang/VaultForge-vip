<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deal Control Center - VaultForge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 20px; }
    .container { max-width: 1200px; margin: 20px auto; }
    h1 { color: #D4AF37; text-align: center; margin-bottom: 30px; font-size: 28px; letter-spacing: 1px; }
    .section { background: #0a0a0a; border: 2px solid #D4AF37; border-radius: 8px; padding: 20px; margin-bottom: 25px; }
    .section h2 { color: #D4AF37; font-size: 20px; margin-bottom: 15px; }
    .pipeline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
    .pipeline-col { background: #111; border: 1px solid #333; border-radius: 6px; padding: 15px; min-height: 200px; }
    .pipeline-col h3 { color: #D4AF37; font-size: 16px; text-align: center; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 8px; }
    .deal-card { background: #1a1a1a; border: 1px solid #444; border-radius: 4px; padding: 10px; margin-bottom: 10px; cursor: pointer; }
    .deal-card:hover { border-color: #D4AF37; }
    .deal-addr { color: #D4AF37; font-weight: bold; font-size: 14px; }
    .deal-price { color: #fff; font-size: 13px; }
    .deal-meta { color: #888; font-size: 11px; margin-top: 4px; }
    .state-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .state-card { background: #111; border: 2px solid #333; border-radius: 6px; padding: 15px; text-align: center; cursor: pointer; }
    .state-card:hover { border-color: #D4AF37; }
    .state-name { color: #D4AF37; font-weight: bold; font-size: 14px; }
    .buyer-count { color: #aaa; font-size: 12px; margin-top: 5px; }
    .hidden { display: none; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: #0a0a0a; border: 2px solid #D4AF37; border-radius: 8px; padding: 30px; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative; }
    .modal-close { position: absolute; top: 10px; right: 15px; background: none; border: none; color: #888; font-size: 24px; cursor: pointer; }
    .modal h3 { color: #D4AF37; margin-bottom: 15px; }
    .buyer-list { max-height: 300px; overflow-y: auto; border: 1px solid #333; border-radius: 4px; padding: 10px; }
    .buyer-item { padding: 8px; border-bottom: 1px solid #222; font-size: 13px; }
    .buyer-item:last-child { border-bottom: none; }
    .btn { padding: 12px 20px; background: #D4AF37; color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
    .btn:hover { background: #e5c158; }
    textarea { width: 100%; min-height: 200px; background: #111; border: 1px solid #333; border-radius: 4px; color: #fff; padding: 12px; font-family: monospace; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>DEAL CONTROL CENTER</h1>
    
    <div class="section">
      <h2>DEAL PIPELINE</h2>
      <div class="pipeline">
        <div class="pipeline-col">
          <h3>ACTIVE</h3>
          <div id="active-deals"></div>
        </div>
        <div class="pipeline-col">
          <h3>CLAIMED</h3>
          <div id="claimed-deals"></div>
        </div>
        <div class="pipeline-col">
          <h3>CLOSED</h3>
          <div id="closed-deals"></div>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>BUYER NETWORK BY STATE</h2>
      <div class="state-grid" id="state-grid"></div>
    </div>
  </div>

  <div id="deal-modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal('deal-modal')">×</button>
      <div id="deal-modal-body"></div>
    </div>
  </div>

  <div id="buyer-modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal('buyer-modal')">×</button>
      <h3 id="buyer-modal-title"></h3>
      <div class="buyer-list" id="buyer-list"></div>
    </div>
  </div>

<script>
let allDeals = [];
let allBuyers = [];
const STATES = ['GEORGIA','TENNESSEE','ALABAMA','FLORIDA','NORTH CAROLINA','SOUTH CAROLINA','TEXAS'];

async function loadData() {
  const [dealsRes, buyersRes] = await Promise.all([
    fetch('/api/get-deals').then(r => r.json()),
    fetch('/api/get-buyers').then(r => r.json())
  ]);
  allDeals = dealsRes || [];
  allBuyers = buyersRes || [];
  renderDeals();
  renderStates();
}

function renderDeals() {
  const cols = { new: 'active-deals', claimed: 'claimed-deals', closed: 'closed-deals' };
  Object.values(cols).forEach(id => document.getElementById(id).innerHTML = '');
  allDeals.forEach(deal => {
    const col = cols[deal.status] || 'active-deals';
    const card = document.createElement('div');
    card.className = 'deal-card';
    card.innerHTML = `
      <div class="deal-addr">${deal.property_address}</div>
      <div class="deal-price">$${parseInt(deal.asking_price).toLocaleString()}</div>
      <div class="deal-meta">${deal.city_state}</div>
    `;
    card.onclick = () => openDealModal(deal);
    document.getElementById(col).appendChild(card);
  });
}

function renderStates() {
  const grid = document.getElementById('state-grid');
  grid.innerHTML = '';
  STATES.forEach(state => {
    const count = allBuyers.filter(b => b.target_states && b.target_states.includes(state)).length;
    const card = document.createElement('div');
    card.className = 'state-card';
    card.innerHTML = `<div class="state-name">${state}</div><div class="buyer-count">${count} Buyers</div>`;
    card.onclick = () => openBuyerModal(state);
    grid.appendChild(card);
  });
}

function openDealModal(deal) {
  const buyersInState = allBuyers.filter(b => b.target_states && b.target_states.includes(deal.city_state.split(',')[1]?.trim().toUpperCase()));
  document.getElementById('deal-modal-body').innerHTML = `
    <h3>${deal.property_address}</h3>
    <p><strong>Asking:</strong> $${parseInt(deal.asking_price).toLocaleString()}</p>
    <p><strong>City:</strong> ${deal.city_state}</p>
    <p><strong>Type:</strong> ${deal.property_types}</p>
    <p><strong>Seller:</strong> ${deal.full_name} - ${deal.phone}</p>
    <p><strong>Buyers in this state:</strong> ${buyersInState.length}</p>
    <textarea id="blast-text">SUBJECT: OFF-MARKET DEAL - ${deal.city_state} - $${parseInt(deal.asking_price).toLocaleString()}

${deal.property_types} Deal Available

Address: ${deal.property_address}
Asking: $${parseInt(deal.asking_price).toLocaleString()}
Type: ${deal.deal_type}

Reply CLAIM + Your Name to lock it in.
First response wins. 48hr performance.

-VaultForge
</textarea>
    <button class="btn" onclick="copyBlast()">COPY BLAST EMAIL</button>
    <button class="btn" onclick="updateStatus('${deal.id}','claimed')">MARK CLAIMED</button>
    <button class="btn" onclick="updateStatus('${deal.id}','closed')">MARK CLOSED</button>
  `;
  document.getElementById('deal-modal').classList.remove('hidden');
}

function openBuyerModal(state) {
  const buyers = allBuyers.filter(b => b.target_states && b.target_states.includes(state));
  document.getElementById('buyer-modal-title').textContent = `${state} - ${buyers.length} Buyers`;
  document.getElementById('buyer-list').innerHTML = buyers.map(b => `
    <div class="buyer-item">
      <strong>${b.full_name}</strong><br>
      ${b.email} | ${b.phone}<br>
      Max: $${parseInt(b.max_price_res||0).toLocaleString()} Res / $${parseInt(b.max_price_com||0).toLocaleString()} Com
    </div>
  `).join('');
  document.getElementById('buyer-modal').classList.remove('hidden');
}

function closeModal(id) {
  document.getElementById(id).classList.add('hidden');
}

function copyBlast() {
  const text = document.getElementById('blast-text').value;
  navigator.clipboard.writeText(text);
  alert('Blast copied to clipboard');
}

async function updateStatus(id, status) {
  await fetch('/api/update-deal', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, status })
  });
  closeModal('deal-modal');
  loadData();
}

loadData();
</script>
</body>
</html>
