<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultForge Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a; 
            color: #fff; 
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #d4af37; margin-bottom: 30px; }
        .stats { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 20px; 
            margin-bottom: 40px; 
        }
        .stat-box { 
            background: #1a1a1a; 
            border: 1px solid #333; 
            border-radius: 8px; 
            padding: 20px; 
        }
        .stat-box h3 { color: #888; font-size: 14px; margin-bottom: 8px; }
        .stat-box .num { color: #d4af37; font-size: 32px; font-weight: 700; }
        .section { margin-bottom: 40px; }
        .section h2 { color: #d4af37; margin-bottom: 20px; }
        table { 
            width: 100%; 
            background: #1a1a1a; 
            border: 1px solid #333; 
            border-radius: 8px; 
            border-collapse: collapse;
            overflow: hidden;
        }
        th, td { 
            padding: 12px; 
            text-align: left; 
            border-bottom: 1px solid #333; 
        }
        th { background: #000; color: #d4af37; font-weight: 600; }
        tr:last-child td { border-bottom: none; }
        .badge { 
            padding: 4px 8px; 
            border-radius: 4px; 
            font-size: 12px; 
            font-weight: 600; 
        }
        .badge-green { background: #1a4d1a; color: #4ade80; }
        .badge-yellow { background: #4d3a1a; color: #fbbf24; }
        .badge-red { background: #4d1a1a; color: #f87171; }
        .badge-gold { background: #4d3a00; color: #d4af37; }
        .loading { text-align: center; color: #888; padding: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>VAULTFORGE ADMIN</h1>
        
        <div class="stats" id="stats">
            <div class="stat-box">
                <h3>Total Deals</h3>
                <div class="num" id="totalDeals">-</div>
            </div>
            <div class="stat-box">
                <h3>Total Buyers</h3>
                <div class="num" id="totalBuyers">-</div>
            </div>
            <div class="stat-box">
                <h3>Title Concierge</h3>
                <div class="num" id="titleCount">-</div>
            </div>
            <div class="stat-box">
                <h3>Avg Deal Score</h3>
                <div class="num" id="avgScore">-</div>
            </div>
        </div>

        <div class="section">
            <h2>Recent Deals</h2>
            <div id="dealsTable" class="loading">Loading deals...</div>
        </div>

        <div class="section">
            <h2>Buyer Network</h2>
            <div id="buyersTable" class="loading">Loading buyers...</div>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                const [dealsRes, buyersRes] = await Promise.all([
                    fetch('/api/get-deals'),
                    fetch('/api/get-buyers')
                ]);
                
                const deals = await dealsRes.json();
                const buyers = await buyersRes.json();
                
                renderStats(deals, buyers);
                renderDeals(deals);
                renderBuyers(buyers);
            } catch (err) {
                document.body.innerHTML = '<div class="loading">Error loading data. Check console.</div>';
                console.error(err);
            }
        }

        function renderStats(deals, buyers) {
            document.getElementById('totalDeals').textContent = deals.length;
            document.getElementById('totalBuyers').textContent = buyers.length;
            
            const titleCount = deals.filter(d => d.title_concierge).length;
            document.getElementById('titleCount').textContent = titleCount;
            
            const scores = deals.filter(d => d.analysis?.deal_score).map(d => d.analysis.deal_score);
            const avgScore = scores.length ? scores.join(', ') : 'N/A';
            document.getElementById('avgScore').textContent = avgScore;
        }

        function renderDeals(deals) {
            if (!deals.length) {
                document.getElementById('dealsTable').innerHTML = '<div class="loading">No deals yet</div>';
                return;
            }
            
            const html = `
                <table>
                    <thead>
                        <tr>
                            <th>Address</th>
                            <th>State</th>
                            <th>Ask</th>
                            <th>ARV</th>
                            <th>ROI</th>
                            <th>Score</th>
                            <th>Title</th>
                            <th>Contact</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${deals.reverse().map(d => `
                            <tr>
                                <td>${d.address || 'N/A'}</td>
                                <td>${d.state || 'N/A'}</td>
                                <td>$${parseInt(d.asking_price || 0).toLocaleString()}</td>
                                <td>$${parseInt(d.arv || 0).toLocaleString()}</td>
                                <td>${d.analysis?.projected_roi || 'N/A'}</td>
                                <td><span class="badge ${d.analysis?.deal_score === 'A' ? 'badge-green' : d.analysis?.deal_score === 'B' ? 'badge-yellow' : 'badge-red'}">${d.analysis?.deal_score || 'N/A'}</span></td>
                                <td>${d.title_concierge ? '<span class="badge badge-gold">$500 PAID</span>' : '-'}</td>
                                <td>${d.seller_name || 'N/A'}<br><small>${d.phone || ''}</small></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById('dealsTable').innerHTML = html;
        }

        function renderBuyers(buyers) {
            if (!buyers.length) {
                document.getElementById('buyersTable').innerHTML = '<div class="loading">No buyers yet</div>';
                return;
            }
            
            const html = `
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>States</th>
                            <th>Buy Box</th>
                            <th>Max Res</th>
                            <th>Max Com</th>
                            <th>Contact</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${buyers.reverse().map(b => `
                            <tr>
                                <td>${b.buyer_name || 'N/A'}</td>
                                <td>${(b.states || []).join(', ')}</td>
                                <td>${[...(b.buybox_res || []), ...(b.buybox_com || [])].join(', ') || 'N/A'}</td>
                                <td>${b.max_price_res ? '$' + parseInt(b.max_price_res).toLocaleString() : 'N/A'}</td>
                                <td>${b.max_price_com ? '$' + parseInt(b.max_price_com).toLocaleString() : 'N/A'}</td>
                                <td>${b.email || 'N/A'}<br><small>${b.phone || ''}</small></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById('buyersTable').innerHTML = html;
        }

        loadData();
    </script>
</body>
</html>
