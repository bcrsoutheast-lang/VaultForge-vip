<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAULTFORGE ADMIN - Veteran Pride VaultForge LLC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: 'Arial', sans-serif; padding: 20px; }
   .header { color: #FFD700; font-size: 32px; font-weight: bold; margin-bottom: 30px; }
   .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
   .stat-card { background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #333; }
   .stat-label { color: #888; font-size: 12px; text-transform: uppercase; margin-bottom: 8px; }
   .stat-value { color: #FFD700; font-size: 28px; font-weight: bold; }
   .section-title { color: #FFD700; font-size: 20px; margin: 30px 0 15px; }
    table { width: 100%; background: #1a1a1a; border-collapse: collapse; border-radius: 8px; overflow: hidden; }
    th { background: #000; color: #FFD700; padding: 12px; text-align: left; font-size: 12px; text-transform: uppercase; }
    td { padding: 12px; border-bottom: 1px solid #333; }
    tr:hover { background: #222; cursor: pointer; }
   .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
   .badge-residential { background: #FFD700; color: #000; }
   .badge-commercial { background: #3b82f6; color: #fff; }
   .badge-land { background: #10b981; color: #000; }
   .badge-grade-a { background: #10b981; color: #000; }
   .badge-grade-b { background: #84cc16; color: #000; }
   .badge-grade-c { background: #FFD700; color: #000; }
   .badge-grade-d { background: #f97316; color: #000; }
   .badge-grade-f { background: #ef4444; color: #fff; }
   .badge-na { background: #555; color: #aaa; }
   .badge-signed { background: #10b981; color: #000; }
   .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; }
   .modal-content { background: #1a1a1a; margin: 40px auto; padding: 30px; max-width: 900px; border-radius: 8px; border: 1px solid #FFD700; }
   .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
   .modal-title { color: #FFD700; font-size: 24px; }
   .close { color: #FFD700; font-size: 32px; cursor: pointer; }
   .btn { background: #FFD700; color: #000; padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin: 5px; }
   .btn-danger { background: #ef4444; color: #fff; }
   .btn-secondary { background: #333; color: #FFD700; }
   .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
   .field-group { margin-bottom: 15px; }
   .field-label { color: #888; font-size: 11px; text-transform: uppercase; margin-bottom: 4px; }
   .field-value { color: #fff; font-size: 14px; }
   .status-select { background: #000; color: #FFD700; border: 1px solid #FFD700; padding: 8px; border-radius: 4px; }
    textarea { width: 100%; background: #000; color: #fff; border: 1px solid #333; padding: 10px; border-radius: 4px; min-height: 80px; }
   .fee-box { background: #000; border: 2px solid #FFD700; padding: 20px; border-radius: 8px; margin: 20px 0; }
   .fee-line { display: flex; justify-content: space-between; margin: 10px 0; font-size: 15px; }
   .fee-total { border-top: 2px solid #FFD700; padding-top: 12px; margin-top: 12px; font-weight: bold; font-size: 18px; color: #10b981; }
   .fee-note { font-size: 11px; color: #888; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="header">VAULTFORGE ADMIN - VETERAN PRIDE VAULTFORGE LLC</div>
  
  <div class="stats" id="stats"></div>
  
  <div class="section-title">Recent Deals</div>
  <table id="dealsTable">
    <thead>
      <tr>
        <th>Address</th>
        <th>Type</th>
        <th>State</th>
        <th>Ask</th>
        <th>ARV</th>
        <th>Grade</th>
        <th>Seller Signed</th>
        <th>Status</th>
        <th>Contact</th>
      </tr>
    </thead>
    <tbody id="dealsBody"></tbody>
  </table>

  <div id="dealModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Deal Room</div>
        <span class="close" onclick="closeModal()">&times;</span>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    let deals = [];
    let currentDeal = null;

    async function loadDeals() {
      const res = await fetch('/api/get-deals');
      deals = await res.json();
      renderStats();
      renderTable();
    }

    function renderStats() {
      const totalDeals = deals.length;
      const avgGrade = calculateAvgGrade(deals);
      const totalVPV = deals.reduce((sum, d) => {
        const profit = (d.arv || 0) - (d.ask || 0) - (d.repairs || 0) - (d.payoff || 0);
        const seller50 = profit > 0? profit * 0.5 : 0;
        const buyer1 = (d.ask || 0) * 0.01;
        return sum + seller50 + buyer1;
      }, 0);
      
      document.getElementById('stats').innerHTML = `
        <div class="stat-card">
          <div class="stat-label">Total Deals</div>
          <div class="stat-value">${totalDeals}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Avg Deal Grade</div>
          <div class="stat-value">${avgGrade}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Projected VPV Revenue</div>
          <div class="stat-value">$${Math.round(totalVPV).toLocaleString()}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Signed Seller Agreements</div>
          <div class="stat-value">${deals.filter(d => d.seller_contract_signed).length}</div>
        </div>
      `;
    }

    function calculateAvgGrade(deals) {
      const grades = { A: 4, B: 3, C: 2, D: 1, F: 0 };
      const validDeals = deals.filter(d => d.analysis?.grade);
      if (validDeals.length === 0) return 'N/A';
      const avg = validDeals.reduce((sum, d) => sum + grades[d.analysis.grade], 0) / validDeals.length;
      return Object.keys(grades).find(k => grades[k] === Math.round(avg)) || 'C';
    }

    function renderTable() {
      const tbody = document.getElementById('dealsBody');
      tbody.innerHTML = deals.map(d => {
        const grade = d.analysis?.grade || 'N/A';
        const gradeClass = grade!== 'N/A'? `badge-grade-${grade.toLowerCase()}` : 'badge-na';
        const typeClass = `badge-${d.property_type}`;
        
        return `
          <tr onclick="openDeal('${d.id}')">
            <td>${d.address || 'N/A'}</td>
            <td><span class="badge ${typeClass}">${d.property_type || 'N/A'}</span></td>
            <td>${d.state || 'N/A'}</td>
            <td>$${d.ask?.toLocaleString() || 0}</td>
            <td>$${d.arv?.toLocaleString() || 0}</td>
            <td><span class="badge ${gradeClass}">${grade}</span></td>
            <td>${d.seller_contract_signed? '<span class="badge badge-signed">Signed</span>' : '<span class="badge badge-na">None</span>'}</td>
            <td>${d.status || 'pending'}</td>
            <td>${d.seller_name || 'N/A'}</td>
          </tr>
        `;
      }).join('');
    }

    function openDeal(id) {
      currentDeal = deals.find(d => d.id === id);
      if (!currentDeal) return;
      
      const d = currentDeal;
      const profit = d.arv - d.ask - d.repairs - d.payoff;
      const seller50 = profit > 0? profit * 0.5 : 0;
      const buyer1 = d.ask * 0.01;
      const totalVPV = seller50 + buyer1;
      
      document.getElementById('modalTitle').textContent = `${d.address} - Deal Room`;
      document.getElementById('modalBody').innerHTML = `
        <div style="margin-bottom:20px;">
          <button class="btn" onclick="sendDeal()">Send Deal</button>
          <button class="btn" onclick="generateWireInstructions()">Wire Instructions</button>
          <button class="btn-secondary" onclick="updateStatus('sold')">Mark Sold</button>
          <button class="btn-secondary" onclick="updateStatus('suspended')">Suspend</button>
          <button class="btn-danger" onclick="deleteDeal()">Delete</button>
        </div>
        
        <div class="fee-box">
          <div class="field-label" style="color:#FFD700;margin-bottom:10px;">VETERAN PRIDE VAULTFORGE LLC REVENUE</div>
          <div class="fee-line">
            <span>Seller: 50% Net Profit Share</span>
            <span style="color:#10b981;">$${seller50.toLocaleString()}</span>
          </div>
          <div class="fee-line">
            <span>Buyer: 1.00% Coordination Fee</span>
            <span style="color:#10b981;">$${buyer1.toLocaleString()}</span>
          </div>
          <div class="fee-line fee-total">
            <span>TOTAL VPV AT CLOSING:</span>
            <span>$${totalVPV.toLocaleString()}</span>
          </div>
          <div class="fee-note">Both fees paid via title at closing. Not either/or. BOTH.</div>
        </div>
        
        <div class="grid-2">
          <div>
            <div class="field-group">
              <div class="field-label">Property Type</div>
              <div class="field-value">${d.property_type}</div>
            </div>
            <div class="field-group">
              <div class="field-label">Address</div>
              <div class="field-value">${d.address}, ${d.state} ${d.zip}</div>
            </div>
            ${d.property_type === 'residential'? `
              <div class="field-group">
                <div class="field-label">Specs</div>
                <div class="field-value">${d.beds} bed / ${d.baths} bath / ${d.sqft} sqft</div>
              </div>
            ` : ''}
            ${d.property_type === 'commercial'? `
              <div class="field-group">
                <div class="field-label">Specs</div>
                <div class="field-value">${d.use_type} / ${d.units} units / ${d.building_sqft} sqft</div>
              </div>
            ` : ''}
            ${d.property_type === 'land'? `
              <div class="field-group">
                <div class="field-label">Specs</div>
                <div class="field-value">${d.acres} acres / Zoned ${d.zoning}</div>
              </div>
            ` : ''}
          </div>
          
          <div>
            <div class="field-group">
              <div class="field-label">Grade</div>
              <div class="field-value" style="font-size:24px;color:#FFD700;">${d.analysis?.grade || 'N/A'}</div>
            </div>
            <div class="field-group">
              <div class="field-label">Asking</div>
              <div class="field-value">$${d.ask?.toLocaleString()}</div>
            </div>
            <div class="field-group">
              <div class="field-label">ARV</div>
              <div class="field-value">$${d.arv?.toLocaleString()}</div>
            </div>
            <div class="field-group">
              <div class="field-label">Net Profit</div>
              <div class="field-value">$${profit.toLocaleString()}</div>
            </div>
          </div>
        </div>
        
        <div class="field-group">
          <div class="field-label">Status</div>
          <select class="status-select" onchange="updateStatus(this.value)">
            <option value="pending" ${d.status === 'pending'? 'selected' : ''}>Pending</option>
            <option value="negotiating" ${d.status === 'negotiating'? 'selected' : ''}>Negotiating</option>
            <option value="under_contract" ${d.status === 'under_contract'? 'selected' : ''}>Under Contract</option>
            <option value="sold" ${d.status === 'sold'? 'selected' : ''}>Sold</option>
            <option value="suspended" ${d.status === 'suspended'? 'selected' : ''}>Suspended</option>
          </select>
        </div>
        
        <div class="field-group">
          <div class="field-label">Seller Info</div>
          <div class="field-value">${d.seller_name} | ${d.phone} | ${d.email}</div>
        </div>
        
        <div class="field-group">
          <div class="field-label">Buyer Info</div>
          <div class="field-value">${d.buyer_name || 'Not Assigned'} | ${d.buyer_email || 'N/A'}</div>
        </div>
        
        <div class="field-group">
          <div class="field-label">Legal Agreement - Seller (50/50)</div>
          <div class="field-value">
            ${d.seller_contract_signed? 
              `<span style="color:#10b981;">✓ Signed VF-S-1.0</span><br>
               <span style="font-size:11px;color:#888;">${d.seller_contract_entity} | ${new Date(d.seller_contract_timestamp).toLocaleString()} | IP: ${d.seller_contract_ip}</span>` 
              : '<span style="color:#ef4444;">Not Signed</span>'}
          </div>
        </div>
        
        <div class="field-group">
          <div class="field-label">Notes</div>
          <textarea id="dealNotes" onchange="saveNotes()">${d.notes || ''}</textarea>
        </div>
      `;
      
      document.getElementById('dealModal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('dealModal').style.display = 'none';
      currentDeal = null;
    }

    async function updateStatus(status) {
      if (!currentDeal) return;
      await fetch('/api/update-deal', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: currentDeal.id, status })
      });
      loadDeals();
      closeModal();
    }

    async function saveNotes() {
      if (!currentDeal) return;
      const notes = document.getElementById('dealNotes').value;
      await fetch('/api/update-deal', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: currentDeal.id, notes })
      });
    }

    async function deleteDeal() {
      if (!currentDeal ||!confirm('Delete this deal permanently?')) return;
      await fetch('/api/delete-deal', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: currentDeal.id })
      });
      loadDeals();
      closeModal();
    }

    function sendDeal() {
      alert('Send Deal: Enter buyer email to blast deal sheet. Logs to sent_to array.');
    }

    function generateWireInstructions() {
      if (!currentDeal) return;
      const d = currentDeal;
      const profit = d.arv - d.ask - d.repairs - d.payoff;
      const seller50 = profit > 0? profit * 0.5 : 0;
      const buyer1 = d.ask * 0.01;
      const totalVPV = seller50 + buyer1;
      
      const text = `
VETERAN PRIDE VAULTFORGE LLC
CLOSING DISBURSEMENT INSTRUCTIONS - BOTH FEES

Property: ${d.address}, ${d.state} ${d.zip}

FEE 1 - SELLER SIDE:
Payee: Veteran Pride VaultForge LLC
Amount: $${seller50.toLocaleString()}
Reason: 50% Net Profit Share per Marketing Agreement VF-S-1.0
Authority: Seller Agreement dated ${new Date(d.seller_contract_timestamp).toLocaleDateString()}
Line Item: Marketing Fee - Veteran Pride VaultForge LLC

FEE 2 - BUYER SIDE:
Payee: Veteran Pride VaultForge LLC
Amount: $${buyer1.toLocaleString()}
Reason: 1.00% Coordination Fee per Buyer Agreement VF-B-1.0
Line Item: Coordination Fee - Veteran Pride VaultForge LLC

TOTAL TO VPV: $${totalVPV.toLocaleString()}

WIRE INSTRUCTIONS:
Bank: [YOUR BANK NAME]
Routing: [YOUR ROUTING NUMBER]
Account: [YOUR ACCOUNT NUMBER]
Entity: Veteran Pride VaultForge LLC
Memo: ${d.address}

Both fees are irrevocably authorized per executed agreements. 
Disburse at closing from respective party funds.

Veteran Pride VaultForge LLC
      `;
      
      navigator.clipboard.writeText(text);
      alert('Wire instructions copied. Both fees included. Send to title company.');
    }

    loadDeals();
  </script>
</body>
</html>
