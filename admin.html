<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - VaultForge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
   .container { max-width: 1200px; margin: 0 auto; }
    h1 { color: #FFD700; margin-bottom: 30px; }
   .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #333; }
   .tab { padding: 10px 20px; background: #1a1a1a; border: none; color: #ccc; cursor: pointer; }
   .tab.active { background: #FFD700; color: #000; }
   .content { display: none; }
   .content.active { display: block; }
    table { width: 100%; border-collapse: collapse; background: #1a1a1a; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
    th { color: #FFD700; }
  </style>
</head>
<body>
  <div class="container">
    <h1>VaultForge Admin</h1>
    <div class="tabs">
      <button class="tab active" onclick="showTab('deals')">Deals</button>
      <button class="tab" onclick="showTab('buyers')">Buyers</button>
    </div>
    <div id="deals" class="content active">
      <table id="dealsTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>City</th>
            <th>Asking</th>
            <th>ARV</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="buyers" class="content">
      <table id="buyersTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Budget</th>
            <th>Markets</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseUrl = 'https://cnxrwnxtpfxoyjymuwvs.supabase.co';
const supabaseKey = 'sb_publishable_t-QviJYrFalcqFST7igSQw_9JbkCeXX';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(tab).classList.add('active');
}

async function loadDeals() {
  const { data } = await supabase.from('deals').select('*').order('created_at', { ascending: false });
  const tbody = document.querySelector('#dealsTable tbody');
  tbody.innerHTML = data.map(d => `
    <tr>
      <td>${new Date(d.created_at).toLocaleDateString()}</td>
      <td>${d.property_type}</td>
      <td>${d.city}, ${d.state}</td>
      <td>$${d.asking_price?.toLocaleString() || '-'}</td>
      <td>$${d.arv?.toLocaleString() || '-'}</td>
      <td>${d.status}</td>
    </tr>
  `).join('');
}

async function loadBuyers() {
  const { data } = await supabase.from('buyers').select('*').order('created_at', { ascending: false });
  const tbody = document.querySelector('#buyersTable tbody');
  tbody.innerHTML = data.map(b => `
    <tr>
      <td>${b.full_name}</td>
      <td>${b.phone}</td>
      <td>${b.email}</td>
      <td>$${b.budget_min?.toLocaleString() || '0'} - $${b.budget_max?.toLocaleString() || '∞'}</td>
      <td>${b.markets?.join(', ') || '-'}</td>
    </tr>
  `).join('');
}

loadDeals();
loadBuyers();
</script>
</body>
</html>
